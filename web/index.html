<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Desk</title>
<style>
/* Tokens and proportions follow the orchestrator's own viewer (tso-view): system faces, hairline borders, 44px rows, 4px radius. */
:root { color-scheme: light; --bg:#f2f3f5; --surface:#fafafb; --surface-2:#eeeff2; --surface-3:#e4e6ea; --border:#dfe2e6; --border-strong:#808893;
  --text:#262a31; --text-2:#565d68; --text-3:#5f6874; --accent:#3563c4; --accent-bg:#e8eef9; --sev:#b0473c; --sev-bg:#f6e9e7; --ok:#3d7054; --warn:#80601e;
  --track:#dcdfe4; --fill:#878f9b; --on-accent:#ffffff; --row-h:44px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Ubuntu,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#15181d; --surface:#1b1f25; --surface-2:#21262d; --surface-3:#292f37;
  --border:#2c323a; --border-strong:#6c7682; --text:#d6dae0; --text-2:#a3abb6; --text-3:#8b939e; --accent:#8aa9e6; --accent-bg:#232c3d; --sev:#d9928a; --sev-bg:#35272a;
  --ok:#86b498; --warn:#c9a96a; --track:#313842; --fill:#6d7784; --on-accent:#15181d; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
header { display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 16px; }
header .brand { font-weight: 600; letter-spacing: .01em; }
header .upd { color: var(--text-3); font-size: 12px; }
header .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); font-size: 12px; }
.chip.need { background: var(--accent); color: var(--on-accent); }
.chip.warn { background: var(--sev-bg); color: var(--sev); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; margin: 24px 0 8px; }
.group { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); overflow: hidden; }
.row { display: grid; align-items: center; min-height: var(--row-h); padding: 6px 12px; gap: 12px; border-top: 1px solid var(--border); }
.group > .row:first-child, .group > details:first-child > summary.row { border-top: 0; }
.row:hover { background: var(--surface-2); }
.epic { grid-template-columns: minmax(0, 1fr) 220px 150px; }
summary.epic { cursor: pointer; }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.epic .name { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.id { font-family: var(--mono); font-size: 12px; color: var(--text-3); white-space: nowrap; }
.epic .name .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 7px; height: 7px; flex: none; align-self: center; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(45deg); }
.epic.leaf .chev { visibility: hidden; }
.epic.sub { padding-left: 34px; }
.bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar i.done { background: var(--fill); }
.bar i.started { background: var(--text); }
.num { font-size: 12px; color: var(--text-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.num b { color: var(--text); font-weight: 500; }
.task { grid-template-columns: 90px minmax(0, 1fr) 190px 110px 40px; cursor: pointer; }
.task .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.road { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.road i { height: 4px; border-radius: 2px; background: var(--track); }
.road i.done { background: var(--fill); }
.road i.now { background: var(--text); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.stage { display: grid; gap: 4px; }
.road.big i { height: 5px; border-radius: 3px; }
.stage small { color: var(--text-2); font-size: 12px; }
.meta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; color: var(--text-3); font-size: 12px; }
.pr { font-family: var(--mono); }
.qicon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px; background: var(--accent); color: var(--on-accent); }
.qicon .ico { width: 14px; height: 14px; }
.muted { color: var(--text-3); }
.empty { padding: 16px 12px; color: var(--text-3); }
.ico.fill { fill: currentColor; stroke: none; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumbs a { color: var(--text-2); font-weight: 600; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { color: var(--text-3); }
.crumbs .cur { font-family: var(--mono); font-size: 13px; color: var(--text); }
.page-title { margin: 22px 0 4px; }
.page-title h1 { font-size: 20px; line-height: 1.35; margin: 0; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip .ico { width: 14px; height: 14px; }
.chip.st { background: var(--accent-bg); color: var(--accent); }
a.chip:hover { background: var(--surface-3); color: var(--text); }
.panel { border: 1px solid var(--border); border-radius: 4px; background: var(--surface); padding: 12px; margin-top: 12px; }
.panel h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.panel h3 .grow { flex: 1; }
.milestones { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
.milestones div { font-size: 12px; color: var(--text-3); line-height: 1.35; }
.milestones div.on { color: var(--text-2); }
.milestones div.now { color: var(--text); font-weight: 600; }
.milestones small { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
.panel.stand { padding: 8px 12px; }
.grow { flex: 1; }
.stand-head { display: flex; align-items: center; gap: 12px; }
.stand-head .state { gap: 0; }
.stand-head h3 { margin: 0; }
.stand-head .state { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
.pills { display: inline-flex; gap: 4px; margin-left: 4px; padding-left: 12px; border-left: 1px solid var(--border); }
.pill { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; color: var(--text-3); transition: background-color .12s ease, color .12s ease; }
.pill:hover { background: var(--surface-2); color: var(--text); }
/* The name floats under the icon: nothing around it moves, so the pointer never loses the button. */
.pill .nm { position: absolute; top: 100%; left: 50%; z-index: 5; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-3); color: var(--text); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-50%, 2px); transition: opacity .12s ease, transform .12s ease; }
.pill:hover .nm { opacity: 1; transform: translate(-50%, 6px); transition-delay: .12s; }
.dot.ok { background: var(--ok); }
.dot.off { background: var(--text-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.adv-msg { margin-top: 10px; }
.adv-who { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.adv-msg.you .body { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.adv-msg.bot .body p { margin: 0 0 8px; }
.adv-msg .body code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border-radius: 3px; padding: 0 4px; }
.adv-msg .body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow: auto; font-size: 12.5px; }
.adv-msg .body ul { margin: 0 0 8px; padding-left: 20px; }
.adv-tools { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--text-3); }
.adv-input { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
.adv-input textarea { margin: 0; min-height: 44px; }
.pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; max-height: 220px; overflow: auto; margin-top: 8px; }
.composer { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.composer:focus-within { border-color: var(--border-strong); }
.composer textarea { display: block; margin: 0; min-height: 76px; border: 0; background: transparent; border-radius: 6px 6px 0 0; outline: none; }
.cbar { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-top: 1px solid var(--border); }
.cbar .grow { flex: 1; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; color: var(--text-3); cursor: pointer; }
.ib:hover { background: var(--surface-2); color: var(--text); }
.ib .ico { width: 17px; height: 17px; }
.send { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 4px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
.send:hover { filter: brightness(1.08); }
.attached { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 12px; color: var(--text-3); }
.attached .ico { width: 14px; height: 14px; }
.q { border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-top: 8px; background: var(--surface); }
.q.open { border-color: var(--accent); }
.q h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.q .who { color: var(--text-3); font-size: 12px; margin-bottom: 6px; }
.q .ctx { white-space: pre-wrap; color: var(--text-2); margin: 6px 0 10px; }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 8px; width: 100%; text-align: left; padding: 8px; border: 1px solid var(--border); border-radius: 4px; margin-top: 6px; }
.opt:hover { background: var(--surface-2); }
.opt.on { border-color: var(--accent); background: var(--accent-bg); }
.opt .k { font-family: var(--mono); color: var(--text-3); }
.opt .c { color: var(--text-2); font-size: 13px; grid-column: 2; }
.quote { border-left: 2px solid var(--border-strong); padding: 2px 0 2px 10px; margin: 8px 0; color: var(--text-2); white-space: pre-wrap; }
.opt .rec { color: var(--ok); font-size: 12px; }
textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 8px; }
textarea:focus { outline: none; border-color: var(--border-strong); }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-2); }
.btn:hover { background: var(--surface-3); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[disabled] { opacity: .5; cursor: default; }
.receipt { font-size: 12px; color: var(--text-3); }
.receipt.err { color: var(--sev); }
.journal { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.journal li { display: grid; grid-template-columns: 110px 130px minmax(0, 1fr); gap: 8px; padding: 4px 0; border-top: 1px solid var(--border); }
.journal li:first-child { border-top: 0; }
.journal .d { color: var(--text-3); font-size: 12px; }
@media (max-width: 760px) { .epic { grid-template-columns: minmax(0, 1fr) 120px; } .epic .num { display: none; } .task { grid-template-columns: 70px minmax(0, 1fr) 90px; } .task .stage small, .task .meta { display: none; } }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 4px; padding: 8px 12px; font-size: 12px; color: var(--text-2); display: grid; grid-template-columns: auto auto; gap: 2px 14px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip b { color: var(--text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header><span class="crumbs" id="crumbs"></span><span class="upd" id="upd"></span><span class="grow"></span><span id="top"></span></header>
<div class="wrap" id="app"></div>
<script>
const STAGES = {"launched": "Запуск", "spec-drafted": "Спецификация", "plan-passed": "План", "gate-round": "Ревью",
  "pre-publish": "Публикация", "pre-merge": "Мерж", "closed": "Закрыта"};
const ICONS = {
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>', send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  comment: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', terminal: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  layout: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>', shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>', code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>', layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>', database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>', box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>', play: '<path d="m6 3 14 9-14 9z"/>', refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>', globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>', check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const LINEAR = 'M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z';
const linearIcon = `<svg class="ico fill" viewBox="0 0 24 24" aria-hidden="true"><path d="${LINEAR}"/></svg>`;
const icon = name => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
const EPIC_TIP_DELAY = 500;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const state = {advisor: new Map(), adv: new Set(), busy: new Map(), data: null, key: "", details: new Map(), open: new Set(), picks: new Map(), drafts: new Map(), receipts: new Map(), images: new Map()};

function short(ts) {
  if (!ts) return "—";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "сейчас";
  if (m < 60) return `${m} мин`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} ч` : `${Math.round(h / 24)} дн`;
}
function when(ts) {
  const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
  return isNaN(d) ? "" : d.toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
}
async function post(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return {res, data: await res.json().catch(() => ({}))};
}


/* a small markdown reader for the advisor's answers */
function md(text) {
  const blocks = String(text || "").split(/```/);
  return blocks.map((b, i) => {
    if (i % 2) return `<pre>${esc(b.replace(/^\w*\n/, "").replace(/\n$/, ""))}</pre>`;
    const inl = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return b.split(/\n{2,}/).map(par => {
      const lines = par.split("\n").filter(l => l.trim());
      if (!lines.length) return "";
      if (lines.every(l => /^\s*[-*] /.test(l))) return `<ul>${lines.map(l => `<li>${inl(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
      return `<p>${lines.map(inl).join("<br>")}</p>`;
    }).join("");
  }).join("");
}

/* ---- epics: finished and empty ones are history, not a task list ---- */
const finished = e => !e.loading && e.done >= e.total && !(e.active || []).length;
function epicInner(e) {
  if (e.loading) return `<span class="name"><span class="chev"></span><span class="id">${esc(e.id)}</span><span class="t">${esc(e.title || e.id)}</span></span><span class="bar"></span><span class="num">читаю…</span>`;
  const pct = n => e.total ? (100 * n / e.total).toFixed(1) + "%" : "0%";
  return `<span class="name"><span class="chev"></span><span class="id">${esc(e.id)}</span>`
    + `<a class="t" href="${esc(e.url || "https://linear.app/mercuryo/issue/" + e.id)}" target="_blank" rel="noopener">${esc(e.title || e.id)}</a></span>`
    + `<span class="bar"><i class="done" style="width:${pct(e.done)}"></i><i class="started" style="width:${pct(e.started)}"></i></span>`
    + `<span class="num"><b>${e.done}</b>/${e.total}${e.started ? ` · <b>${e.started}</b> в работе` : ""}${e.today ? ` · +${e.today}` : ""}</span>`;
}
const epicTip = e => esc(JSON.stringify({total: e.total, done: e.done, today: e.today, started: e.started, left: e.total - e.done, dead: e.dead}));
function epicsBlock(list) {
  const shown = (list || []).filter(e => !finished(e));
  if (!shown.length) return `<div class="group"><div class="empty">${list && list.length ? "Все эпики закрыты" : "Эпики читаются из Linear…"}</div></div>`;
  return `<div class="group">` + shown.map(e => {
    const subs = (e.stages || []).filter(st => st.id && !finished(st) && st.total > 0);
    if (!subs.length) return `<div class="row epic leaf" data-tip="${epicTip(e)}">${epicInner(e)}</div>`;
    const k = "epic:" + e.id;
    return `<details data-key="${esc(k)}" ${state.open.has(k) ? "open" : ""}><summary class="row epic" data-tip="${epicTip(e)}">${epicInner(e)}</summary>`
      + subs.map(st => `<div class="row epic sub leaf" data-tip="${epicTip(st)}">${epicInner(st)}</div>`).join("") + `</details>`;
  }).join("") + `</div>`;
}

/* ---- tasks in work ---- */
function road(s) {
  const idx = s.progress.index;
  return `<span class="road">` + state.data.checkpoints.map((c, i) => `<i class="${i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : ""}" title="${esc(STAGES[c] || c)}"></i>`).join("") + `</span>`;
}
function stageLabel(s) {
  const idx = s.progress.index;
  if (s.prompt) return "ждёт ввода";
  return idx >= 0 ? (STAGES[state.data.checkpoints[idx]] || "") + (s.progress.inferred ? " · оценка" : "") : "—";
}
function taskRow(s) {
  const t = (s.links.linear || {}).title || s.header.title || s.id;
  const pr = s.links.pr || {};
  const nq = (s.questions || []).length + (s.prompt ? 1 : 0);
  return `<a class="row task" href="#/task/${esc(s.id)}"><span class="id">${esc(s.id)}</span><span class="title" title="${esc(t)}">${esc(t)}</span>`
    + `<span class="stage">${road(s)}<small>${esc(stageLabel(s))}</small></span>`
    + `<span class="meta">${pr.number ? `<span class="pr">#${esc(pr.number)}</span>` : ""}<span>${short(s.last_ts)}</span></span>`
    + `<span class="meta">${nq ? `<span class="qicon" title="Есть вопрос к вам">${icon("help")}</span>` : ""}</span></a>`;
}
function homeView(d) {
  const open = d.streams.filter(s => !s.closed);
  const gq = d.general_questions || [];
  return (gq.length ? `<h2>Вопросы без задачи</h2>` + gq.map(questionCard).join("") : "")
    + `<h2>Эпики</h2>` + epicsBlock(d.epics)
    + `<h2>В работе</h2>` + (open.length ? `<div class="group">${open.map(taskRow).join("")}</div>` : `<div class="group"><div class="empty">Нет задач в работе</div></div>`);
}

/* ---- questions: filed with tso ask, answered through tso answer ---- */
function questionCard(q) {
  const det = state.details.get(q.id);
  const pick = state.picks.get(q.id) || {};
  const opts = det ? det.options : [];
  const answered = q.status !== "open";
  const rc = state.receipts.get(q.id);
  const draft = (state.drafts.get("q:" + q.id) || "").trim();
  return `<div class="q ${answered ? "" : "open"}" data-q="${esc(q.id)}"><h3>${esc(q.title)} <span class="id">${esc(q.id)} · ${esc(q.status)}${q.stream ? " · " + esc(q.stream) : ""}</span></h3>`
    + (det && det.context ? `<div class="ctx">${esc(det.context)}</div>` : det ? "" : `<div class="muted">читаю вопрос…</div>`)
    + opts.map(o => `<button class="opt ${pick.option === o.key ? "on" : ""}" ${answered ? "disabled" : ""} data-pick="${esc(q.id)}" data-key="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span>${esc(o.label)} ${o.recommended ? `<span class="rec">рекомендую${det.why ? ": " + esc(det.why) : ""}</span>` : ""}</span><span class="c">${esc(o.consequence)}</span></button>`).join("")
    + (answered ? `<div class="receipt">Ответ записан${det && det.answer ? ": " + esc(det.answer.option || det.answer.text) : ""}. ${det && det.delivery ? esc(det.delivery.join(" · ")) : ""}</div>`
      : `<textarea data-qtext="${esc(q.id)}" placeholder="Комментарий к ответу (необязательно)">${esc(state.drafts.get("q:" + q.id) || "")}</textarea>`
        + `<div class="actions"><button class="btn primary" data-answer="${esc(q.id)}" data-stream="${esc(q.stream)}" ${pick.option || draft ? "" : "disabled"}>Ответить</button><span class="receipt ${rc && rc.err ? "err" : ""}">${esc(rc ? rc.text : "")}</span></div>`)
    + `</div>`;
}
function loadDetails(qs) {
  qs.filter(q => !state.details.has(q.id) && !state.details.get("loading:" + q.id)).slice(0, 12).forEach(q => {
    state.details.set("loading:" + q.id, true);
    fetch("/api/question/" + q.id).then(r => r.json()).then(d => { if (!d.error) { state.details.set(q.id, d); render(true); } }).catch(() => {});
  });
}

/* ---- one task ---- */
const APP = {running: "запущен", stopped: "остановлен", partial: "частично", unknown: "неизвестно"};
function standPanel(s) {
  const w = s.workspace || {};
  if (!w.available) return "";
  const info = w.info || {}, web = info.web || {}, st = info.status || {};
  const up = w.app_up, starting = up && up.running, app = st.application, b = state.busy.get(s.id) || "";
  const pill = (name, ico, url) => url ? `<a class="pill" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(name + " · " + url.replace(/^https?:\/\//, ""))}" aria-label="${esc(name)}">${icon(ico)}<span class="nm">${esc(name)}</span></a>` : "";
  const label = starting ? "запускается" : APP[app] || app || "неизвестно";
  const pills = w.loading || w.error ? "" : `<span class="pills">${pill("Console", "layout", web.console)}${pill("Admin", "shield", web.admin)}${pill("API", "code", web.api)}${pill("RabbitScout", "layers", web.rabbitscout)}${pill("DbGate", "database", web.dbgate)}${pill("ObjectStore", "box", web.objectstore)}</span>`;
  const note = w.loading ? `<div class="muted" style="margin-top:8px">Читаю task workspace:info…</div>` : w.error ? `<div class="receipt err" style="margin-top:8px">${esc(w.error)}</div>` : "";
  return `<div class="panel stand"><div class="stand-head"><h3>Стенд</h3><span class="state" title="${esc(label)}${w.checked ? " · проверено " + esc(when(w.checked)) : ""}"><span class="dot ${app === "running" ? "ok" : starting ? "pulse" : "off"}"></span></span>${pills}<span class="grow"></span>`
    + `<button class="ib" data-ws="up" data-stream="${esc(s.id)}" ${b || starting || app === "running" ? "disabled" : ""} title="Запустить task app:up">${icon("play")}</button>`
    + `<button class="ib" data-ws="refresh" data-stream="${esc(s.id)}" ${b ? "disabled" : ""} title="Обновить состояние стенда">${icon("refresh")}</button></div>`
    + note + (up ? `<details data-key="${esc(s.id + ":appup")}" ${state.open.has(s.id + ":appup") ? "open" : ""}><summary class="receipt" style="cursor:pointer;margin-top:8px">Вывод app:up${up.running ? " (идёт)" : " · код " + esc(up.exit_code)}</summary><div class="pre">${esc(up.tail || "")}</div></details>` : "") + `</div>`;
}

function advisorMessages(id) {
  const st = state.advisor.get(id);
  if (!st) return `<div class="muted">Загружаю беседу…</div>`;
  const msgs = st.messages.map(m => m.role === "user"
    ? `<div class="adv-msg you"><div class="adv-who">Вы · ${esc(when(m.ts))}${m.model ? " · " + esc(m.model) : ""}</div><div class="body">${md(m.text)}</div></div>`
    : `<div class="adv-msg bot"><div class="adv-who">Советчик · ${esc(when(m.ts))}</div>${m.error ? `<div class="receipt err">${esc(m.error)}</div>` : ""}<div class="body">${md(m.text)}</div>`
      + ((m.tools || []).length ? `<details><summary class="receipt" style="cursor:pointer">что читал · ${m.tools.length}</summary><ul class="adv-tools">${m.tools.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>` : "") + `</div>`).join("");
  const run = st.running;
  const live = run ? `<div class="adv-msg bot"><div class="adv-who">Советчик думает · ${Math.round(Date.now() / 1000 - run.started)} с</div>`
    + (run.tools.length ? `<ul class="adv-tools">${run.tools.slice(-4).map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "")
    + (run.text.trim() ? `<div class="body">${md(run.text)}</div>` : "") + `</div>` : "";
  return msgs + live || `<div class="muted">Спросите что угодно про задачу: код, решение, вопрос оркестратора. Советчик только читает worktree.</div>`;
}
function advisorPanel(s) {
  const st = state.advisor.get(s.id);
  if (!state.adv.has(s.id) && !(st && (st.messages.length || st.running))) return "";
  const running = !!(st && st.running);
  return `<div class="panel" id="adv" data-stream="${esc(s.id)}"><h3>${icon("terminal")}Вопрос по задаче<span class="chip">${esc((st && st.model) || "sonnet")}</span><span class="grow"></span>`
    + `<button class="ib" data-advclose="${esc(s.id)}" title="Закрыть беседу и забыть её">${icon("x")}</button></h3>`
    + `<div id="adv-thread">${advisorMessages(s.id)}</div>`
    + `<div class="adv-input"><textarea data-advtext="${esc(s.id)}" placeholder="Продолжить разговор с советником" ${running ? "disabled" : ""}>${esc(state.drafts.get("adv:" + s.id) || "")}</textarea>`
    + `<button class="send" data-advsend="${esc(s.id)}" ${running ? "disabled" : ""}>${icon("send")}${running ? "Отвечает…" : "Спросить"}</button></div></div>`;
}
async function loadAdvisor(id) {
  clearTimeout(state.advTimer);
  try {
    const res = await fetch("/api/advisor?stream=" + encodeURIComponent(id), {cache: "no-store"});
    const data = await res.json();
    if (res.ok) state.advisor.set(id, data);
  } catch (e) { /* retried on the next tick */ }
  const st = state.advisor.get(id) || {};
  if (st.running) state.advTimer = setTimeout(() => loadAdvisor(id), 1000);
  const panel = document.getElementById("adv");
  if (!panel || panel.dataset.stream !== id) return;
  document.getElementById("adv-thread").innerHTML = advisorMessages(id);
  const btn = panel.querySelector("[data-advsend]"), ta = panel.querySelector("textarea");
  btn.disabled = !!st.running; ta.disabled = !!st.running;
  btn.lastChild.textContent = st.running ? "Отвечает…" : "Спросить";
  if (!st.running && state.advRan === id) { state.advRan = ""; ta.focus(); }
  if (st.running) state.advRan = id;
}

function taskView(d, id) {
  const s = d.streams.find(x => x.id === id);
  if (!s) return `<div class="empty">Задача ${esc(id)} не найдена</div>`;
  const lk = s.links || {}, pr = lk.pr || {}, t = (lk.linear || {}).title || s.header.title || s.id;
  const orch = d.orchestrators.find(o => o.name === s.orchestrator) || {};
  const ms = s.milestones || [];
  const key = "reply:" + s.id;
  const imgs = state.images.get(key) || [];
  const rc = state.receipts.get(key) || {};
  const idx = s.progress.index;
  const chips = [
    `<span class="chip st" ${s.progress.inferred ? 'title="В журнале задачи нет записей, поэтому этап оценён по её PR: нет PR — план, открыт — публикация, влит — мерж"' : ""}>${esc(stageLabel(s))}</span>`,
    lk.linear && lk.linear.url ? `<a class="chip" href="${esc(lk.linear.url)}" target="_blank" rel="noopener" title="Открыть в Linear">${linearIcon}${esc(lk.linear.state || "")}</a>` : "",
    pr.url ? `<a class="chip" href="${esc(pr.url)}" target="_blank" rel="noopener">${icon("pr")}#${esc(pr.number)}${pr.state ? " · " + esc(pr.state.toLowerCase()) : ""}</a>` : "",
    s.last_ts ? `<span class="chip">${icon("clock")}${short(s.last_ts)}</span>` : "",
    ""
  ].join("");
  return `<div class="page-title"><h1 title="${esc(t)}">${esc(t)}</h1><div class="chips">${chips}</div></div>`
    + `<div class="panel"><div class="stage"><span class="road">${state.data.checkpoints.map((c, i) => `<i class="${i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : ""}"></i>`).join("")}</span></div>`
    + `<div class="milestones">${state.data.checkpoints.map((c, i) => `<div class="${i === idx ? "now" : ms[i] && ms[i].ts ? "on" : ""}">${esc(STAGES[c] || c)}${ms[i] && ms[i].ts ? `<small>${when(ms[i].ts)}</small>` : ""}</div>`).join("")}</div></div>`
    + (s.prompt ? promptPanel(s, s.prompt) : "")
    + (s.questions || []).map(questionCard).join("")
    + standPanel(s)
    + `<div class="panel"><h3>Сообщение</h3><div class="composer">`
    + `<textarea data-reply="${esc(s.id)}" placeholder="Оркестратору по ${esc(s.id)}: ответ, комментарий или вопрос по задаче">${esc(state.drafts.get(key) || "")}</textarea>`
    + `<div class="cbar"><label class="ib" title="Прикрепить картинку">${icon("image")}<input type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden data-attach="${esc(s.id)}"></label>`
    + `<button class="ib" data-note="${esc(s.id)}" data-session="${esc(orch.session_id || "")}" title="Отправить как комментарий: оркестратор учтёт, отвечать не обязан">${icon("comment")}</button>`
    + `<button class="ib" data-askadv="${esc(s.id)}" title="Задать как вопрос советнику: ответ появится ниже, беседу можно продолжить">${icon("terminal")}</button>`
    + imgs.map(p => `<span class="attached">${icon("image")}${esc(p.split("/").pop())}</span>`).join("")
    + `<span class="receipt ${rc.err ? "err" : ""}" style="margin-left:8px">${esc(rc.text || "")}</span><span class="grow"></span>`
    + `<button class="send" data-send="${esc(s.id)}" data-session="${esc(orch.session_id || "")}" title="Ответ оркестратору">${icon("send")}Ответить</button></div></div></div>`
    + advisorPanel(s)
    + `<div class="panel"><h3>Журнал</h3><ul class="journal">${(s.events || []).slice().reverse().map(e =>
        `<li><span class="d">${when(e.ts)}</span><span class="d">${esc(e.checkpoint ? (STAGES[e.checkpoint] || e.checkpoint) + " " + e.direction : "заметка")}</span><span>${esc(e.text)}</span></li>`).join("") || `<li class="muted">Записей нет</li>`}</ul></div>`;
}
/* A question on the stream's own screen (outside tso ask): a held cross-session message or a menu of the session. */
function promptPanel(s, p) {
  if (p.error) return `<div class="q open"><h3>${icon("help")}Сессия ждёт ввода</h3><div class="receipt err">Экран не прочитан: ${esc(p.error)}</div></div>`;
  const opts = (p.options || []).filter(o => !/^(type something|chat about this)/i.test(o.label));
  const btn = o => `<button class="opt" data-term="${esc(s.id)}" data-key="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span>${esc(o.label)}</span>${o.hint ? `<span class="c">${esc(o.hint)}</span>` : ""}</button>`;
  if (p.kind === "held") {
    return `<div class="q open"><h3>${icon("help")}${esc(p.title)}</h3>`
      + `<div class="who">${p.sender ? "Отправитель: " + esc(p.sender) : "Отправитель не назван"} · сообщение ждёт вашего решения в окне сессии</div>`
      + (p.body.length ? `<div class="quote">${esc(p.body.join("\n"))}</div>` : "")
      + (p.truncated ? `<div class="receipt">Показано не всё: полный текст виден сессии только после «Доставить».</div>` : "")
      + opts.map(btn).join("") + `</div>`;
  }
  return `<div class="q open"><h3>${icon("help")}${esc(p.title || "Вопрос в терминале сессии")}</h3>`
    + (p.body && p.body.length ? `<div class="ctx">${esc(p.body.join("\n"))}</div>` : "")
    + opts.map(btn).join("")
    + (!opts.length ? `<div class="receipt">Вариантов нет: ответьте в окне сессии.</div>` : "") + `</div>`;
}

/* ---- render loop ---- */
function render(force) {
  const d = state.data;
  if (!d) return;
  const editing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
  const route = location.hash.match(/^#\/task\/(.+)$/);
  const key = JSON.stringify([d.streams.map(s => [s.id, s.progress, s.last_ts, (s.questions || []).map(q => q.id + q.status), !!s.prompt]), d.epics, d.general_questions, location.hash]);
  if (!force && (key === state.key || editing)) return;
  state.key = key;
  const qs = [...(d.general_questions || []), ...d.streams.flatMap(s => s.questions || [])];
  loadDetails(qs);
  if (route) { const rid = decodeURIComponent(route[1]); if (!state.advisor.has(rid)) { state.advisor.set(rid, null); loadAdvisor(rid).then(() => { const st = state.advisor.get(rid); if (st && (st.messages.length || st.running)) render(true); }); } }
  document.getElementById("crumbs").innerHTML = route
    ? `<a class="brand" href="#/" title="Все задачи">Desk</a><span class="sep">/</span><span class="cur">${esc(decodeURIComponent(route[1]))}</span>`
    : `<span class="brand">Desk</span>`;
  document.getElementById("app").innerHTML = route ? taskView(d, decodeURIComponent(route[1])) : homeView(d);
  const nq = qs.filter(q => q.status === "open").length;
  const under = (d.orchestrators[0] || {}).under_tso;
  document.getElementById("top").innerHTML = (nq ? `<span class="chip need">вопросов: ${nq}</span> ` : "")
    + (under === false ? `<span class="chip warn" title="Ни одна линия не запущена через tso: доставки с подтверждением нет">не под tso</span>` : "");
  document.getElementById("upd").textContent = "обновлено " + new Date().toLocaleTimeString("ru-RU", {hourCycle: "h23"});
}
async function load() {
  try {
    const res = await fetch("/api/state");
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || res.status);
    if (state.data && d.ui_version !== state.data.ui_version) return location.reload();
    state.data = d;
    render();
  } catch (e) { document.getElementById("upd").textContent = "нет связи: " + e.message; }
}

/* ---- events ---- */
document.addEventListener("click", async e => {
  const t = e.target;
  const pick = t.closest("[data-pick]");
  if (pick && !pick.disabled) { state.picks.set(pick.dataset.pick, {option: pick.dataset.key}); return render(true); }
  const ans = t.closest("[data-answer]");
  if (ans && !ans.disabled) {
    const id = ans.dataset.answer, p = state.picks.get(id) || {}, text = (state.drafts.get("q:" + id) || "").trim();
    state.receipts.set(id, {text: "Отправляю…"}); render(true);
    const {res, data} = await post("/api/answer", {id, stream: ans.dataset.stream, option: p.option || "", text});
    state.receipts.set(id, {text: data.message || data.error || "", err: !res.ok});
    if (res.ok) { state.picks.delete(id); state.drafts.delete("q:" + id); state.details.delete(id); state.details.delete("loading:" + id); }
    await load(); return render(true);
  }
  const note = t.closest("[data-note]");
  if (note) {
    const sid = note.dataset.note, key = "reply:" + sid, text = (state.drafts.get(key) || "").trim();
    if (!text) return;
    state.receipts.set(key, {text: "Отправляю…"}); render(true);
    const {res, data} = await post("/api/reply", {session_id: note.dataset.session, stream: sid, text, images: [], kind: "note"});
    state.receipts.set(key, {text: res.ok ? "Комментарий доставлен" : "Не доставлено: " + (data.error || (data.tso || {}).message || res.status), err: !res.ok});
    if (res.ok) state.drafts.delete(key);
    return render(true);
  }
  const adv = t.closest("[data-askadv]");
  if (adv) {
    const sid = adv.dataset.askadv, key = "reply:" + sid, text = (state.drafts.get(key) || "").trim();
    if (!text) { state.receipts.set(key, {text: "Сначала напишите вопрос", err: true}); return render(true); }
    const {res, data} = await post("/api/advisor", {stream: sid, question: text, model: "sonnet"});
    if (!res.ok) { state.receipts.set(key, {text: "Не принято: " + (data.error || res.status), err: true}); return render(true); }
    state.drafts.delete(key); state.receipts.delete(key); state.adv.add(sid);
    render(true); await loadAdvisor(sid);
    const p = document.getElementById("adv"); if (p) p.scrollIntoView({behavior: "smooth", block: "nearest"});
    return;
  }
  const advsend = t.closest("[data-advsend]");
  if (advsend && !advsend.disabled) {
    const sid = advsend.dataset.advsend, text = (state.drafts.get("adv:" + sid) || "").trim();
    if (!text) return;
    const {res} = await post("/api/advisor", {stream: sid, question: text, model: (state.advisor.get(sid) || {}).model || "sonnet"});
    if (res.ok) { state.drafts.delete("adv:" + sid); const ta = document.querySelector(`[data-advtext="${sid}"]`); if (ta) ta.value = ""; await loadAdvisor(sid); }
    return;
  }
  const advclose = t.closest("[data-advclose]");
  if (advclose) {
    const sid = advclose.dataset.advclose;
    await post("/api/advisor/reset", {stream: sid});
    state.advisor.delete(sid); state.adv.delete(sid); state.drafts.delete("adv:" + sid);
    return render(true);
  }
  const ws = t.closest("[data-ws]");
  if (ws && !ws.disabled) {
    const sid = ws.dataset.stream;
    state.busy.set(sid, ws.dataset.ws); render(true);
    await post("/api/workspace/" + ws.dataset.ws, {stream: sid});
    state.busy.delete(sid); await load(); return render(true);
  }
  const term = t.closest("[data-term]");
  if (term) { await post("/api/terminal", {stream: term.dataset.term, key: term.dataset.key}); await load(); return render(true); }
  const send = t.closest("[data-send]");
  if (send) {
    const sid = send.dataset.send, key = "reply:" + sid, text = (state.drafts.get(key) || "").trim();
    if (!text && !(state.images.get(key) || []).length) return;
    state.receipts.set(key, {text: "Отправляю…"}); render(true);
    const {res, data} = await post("/api/reply", {session_id: send.dataset.session, stream: sid, text, images: state.images.get(key) || [], kind: "reply"});
    state.receipts.set(key, {text: res.ok ? "Доставлено" + (data.via ? " (" + data.via + ")" : "") : "Не доставлено: " + (data.error || (data.tso || {}).message || res.status), err: !res.ok});
    if (res.ok) { state.drafts.delete(key); state.images.delete(key); }
    return render(true);
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.qtext) {
    state.drafts.set("q:" + t.dataset.qtext, t.value);
    const b = document.querySelector(`[data-answer="${t.dataset.qtext}"]`);
    if (b) b.disabled = !(t.value.trim() || (state.picks.get(t.dataset.qtext) || {}).option);
  }
  if (t.dataset.reply) state.drafts.set("reply:" + t.dataset.reply, t.value);
  if (t.dataset.advtext) state.drafts.set("adv:" + t.dataset.advtext, t.value);
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (!t.dataset.attach || !t.files[0]) return;
  const f = t.files[0], key = "reply:" + t.dataset.attach;
  const res = await fetch("/api/upload", {method: "POST", headers: {"Content-Type": f.type}, body: f});
  const d = await res.json().catch(() => ({}));
  if (res.ok) state.images.set(key, [...(state.images.get(key) || []), d.path]);
  else state.receipts.set(key, {text: "Картинка: " + (d.error || res.status), err: true});
  render(true);
});
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.key; if (k) { e.target.open ? state.open.add(k) : state.open.delete(k); } }, true);
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(true); });

/* ---- epic statistics on hover, after half a second ---- */
let tipTimer = null, tipEl = null;
function hideTip() { clearTimeout(tipTimer); tipTimer = null; if (tipEl) { tipEl.remove(); tipEl = null; } }
document.addEventListener("mouseover", e => {
  const row = e.target.closest(".epic[data-tip]");
  if (!row || row.contains(e.relatedTarget)) return;
  hideTip();
  tipTimer = setTimeout(() => {
    let d; try { d = JSON.parse(row.dataset.tip); } catch (_) { return; }
    const lines = [["всего", d.total], ["сделано", d.done], ["сделано сегодня", d.today], ["в работе", d.started], ["осталось", d.left], ["отменено, не считаются", d.dead]];
    tipEl = document.createElement("div"); tipEl.className = "tip";
    tipEl.innerHTML = lines.map(([k, v]) => `<span>${k}</span><b>${v ?? 0}</b>`).join("");
    document.body.appendChild(tipEl);
    const r = row.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let top = r.bottom + 6; if (top + h > innerHeight - 8) top = r.top - h - 6;
    tipEl.style.top = top + "px"; tipEl.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
    requestAnimationFrame(() => tipEl && tipEl.classList.add("on"));
  }, EPIC_TIP_DELAY);
});
document.addEventListener("mouseout", e => { const row = e.target.closest(".epic[data-tip]"); if (row && !row.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("scroll", hideTip, true);

load();
setInterval(load, 10000);
</script>
</body>
</html>
