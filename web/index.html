<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи оркестратора</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23f5f5f5%22/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --surface-base: #0b0b0b;
  --surface-card: #141414;
  --surface-raised: #1b1b1b;
  --surface-inset: #101010;
  --surface-hover: #1c1c1c;
  --border: #262626;
  --border-strong: #3a3a3a;
  --text-primary: #f5f5f5;
  --text-secondary: #b8b8b8;
  --text-muted: #8c8c8c;
  --text-inverse: #0b0b0b;
  --danger: #ff8a80;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --r: 9px;
  --r-sm: 7px;
  --r-lg: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface-base); color: var(--text-primary); }
body { font: 400 var(--text-base)/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--text-primary); }
code { font: 0.86em var(--font-mono); background: var(--surface-raised); border: 1px solid var(--border); padding: 0 5px; border-radius: 5px; }
pre { font: var(--text-xs)/1.5 var(--font-mono); background: var(--surface-inset); border: 1px solid var(--border); padding: var(--space-3); border-radius: var(--r-sm); overflow-x: auto; white-space: pre-wrap; margin: 0; }
pre code { background: none; border: 0; padding: 0; }

.page { max-width: 1180px; margin: 0 auto; padding: 26px 30px 80px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-6); }
h1 { font-size: var(--text-xl); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1.big { font-size: var(--text-2xl); line-height: 1.25; }
.sub { color: var(--text-secondary); font-size: var(--text-sm); margin-top: var(--space-1); }
.muted { color: var(--text-muted); }
.back { display: inline-block; font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-4); text-decoration: none; }
.back:hover { color: var(--text-primary); }
.stats { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.stat { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 12px; font-size: var(--text-sm); color: var(--text-secondary); }
.stat b { color: var(--text-primary); font-weight: 600; margin-right: 4px; }

.panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: var(--space-6); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: var(--text-base); font-weight: 600; margin: 0; }
.panel-head .count { font-size: var(--text-xs); color: var(--text-secondary); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
.panel-head .right { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
.panel-body { padding: var(--space-4) var(--space-5); }
.empty { padding: var(--space-5); color: var(--text-muted); font-size: var(--text-sm); }

.list-row { display: flex; gap: var(--space-4); align-items: center; padding: 12px var(--space-5); border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--surface-hover); }
.list-main { flex: 1; min-width: 0; }
.list-ask { color: var(--text-secondary); font-size: var(--text-sm); margin-top: 2px; }
.list-side { color: var(--text-muted); font-size: var(--text-sm); white-space: nowrap; }

.id { font: 500 var(--text-xs) var(--font-mono); color: var(--text-muted); }
.task-title { font-weight: 500; color: var(--text-primary); }

table.tasks { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tasks th { text-align: left; font-weight: 500; font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 10px var(--space-5); border-bottom: 1px solid var(--border); }
.tasks td { padding: 12px var(--space-5); border-bottom: 1px solid var(--border); vertical-align: top; }
.tasks tr.row { cursor: pointer; }
.tasks tr.row:hover td { background: var(--surface-hover); }
.tasks tr:last-child td { border-bottom: 0; }
.tasks .col-task { width: 46%; }
.tasks .col-when { white-space: nowrap; color: var(--text-secondary); }

.stage { display: grid; gap: 6px; min-width: 140px; }
.bar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.bar i { height: 4px; border-radius: 2px; background: var(--border-strong); }
.bar i.done { background: var(--text-primary); }
.bar i.now { background: var(--text-muted); }
.stage-label { color: var(--text-secondary); font-size: var(--text-xs); }

.badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: 500; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--border-strong); color: var(--text-secondary); white-space: nowrap; }
.badge.you { background: var(--text-primary); color: var(--text-inverse); border-color: var(--text-primary); }
.badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.quiet { border-color: transparent; background: var(--surface-raised); }
.links { display: flex; gap: var(--space-3); white-space: nowrap; }
.links a { color: var(--text-secondary); }
.head-meta .bar { display: inline-grid; width: 112px; margin-right: 8px; vertical-align: middle; }
.head-meta { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-top: var(--space-3); font-size: var(--text-sm); }

.question { font-size: 1.05rem; font-weight: 500; }
.question li { margin: 2px 0; }
.question ul { margin: 0; padding-left: 20px; }
.msg-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: var(--space-4) 0 var(--space-2); }
.quote { background: var(--surface-inset); border: 1px solid var(--border); border-radius: var(--r); padding: var(--space-4) var(--space-5); font-size: 0.95rem; line-height: 1.65; }
.quote > :first-child { margin-top: 0; } .quote > :last-child { margin-bottom: 0; }
.quote p { margin: 0 0 var(--space-3); }
.quote ul { margin: 0 0 var(--space-3); padding-left: 20px; }
.quote li { margin: 2px 0; }
.quote table { border-collapse: collapse; font-size: var(--text-sm); margin: var(--space-2) 0 var(--space-3); }
.quote th, .quote td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.quote th { color: var(--text-secondary); font-weight: 500; }
.quote-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 6px; }
.stack { display: grid; gap: var(--space-3); }

.contour { display: grid; gap: var(--space-4); }
.contour-links { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.contour-links a { display: inline-flex; flex-direction: column; min-width: 150px; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--r); text-decoration: none; }
.contour-links a:hover { background: var(--surface-hover); border-color: var(--text-muted); }
.contour-links a span { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px var(--space-4); font-size: var(--text-sm); }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; color: var(--text-secondary); overflow-wrap: anywhere; }

.milestones { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-2); }
.ms { font-size: var(--text-xs); color: var(--text-muted); border-top: 2px solid var(--border-strong); padding-top: 6px; }
.ms.done { color: var(--text-secondary); border-top-color: var(--text-primary); }
.ms b { display: block; font-weight: 500; color: inherit; }
.log { list-style: none; margin: 0; padding: 0; font-size: var(--text-sm); }
.log li { display: grid; grid-template-columns: 120px 1fr; gap: var(--space-3); padding: 6px 0; border-top: 1px solid var(--border); color: var(--text-secondary); }
.log li:first-child { border-top: 0; }
.log li.note { color: var(--text-muted); }
.log .cp { color: var(--text-primary); font-weight: 500; }

details > summary { cursor: pointer; font-size: var(--text-sm); color: var(--text-secondary); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
details[open] > summary { margin-bottom: var(--space-3); }

textarea { width: 100%; min-height: 96px; resize: vertical; font: var(--text-base)/1.5 var(--font-sans); color: var(--text-primary); background: var(--surface-inset); border: 1px solid var(--border-strong); border-radius: var(--r); padding: 10px 12px; }
textarea:focus { outline: none; border-color: var(--text-secondary); box-shadow: 0 0 0 3px rgba(255, 255, 255, .08); }
.row-actions { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
button { font: 500 var(--text-sm) var(--font-sans); border-radius: var(--r); border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); padding: 7px 14px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--surface-hover); }
button.primary { background: var(--text-primary); color: var(--text-inverse); border-color: var(--text-primary); }
button.primary:hover { background: #dcdcdc; }
button:disabled { opacity: .45; cursor: default; }
.receipt { font-size: var(--text-sm); color: var(--text-secondary); }
.receipt.err { color: var(--danger); white-space: pre-wrap; }
.error { color: var(--danger); font-size: var(--text-sm); white-space: pre-wrap; }
.toggle { background: none; border: 0; padding: 0; color: var(--text-secondary); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
.toggle:hover { background: none; color: var(--text-primary); }


.row-ask { margin-top: 4px; font-size: var(--text-xs); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-head { margin-bottom: var(--space-6); }
.task-head-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); font-size: var(--text-sm); margin-bottom: var(--space-2); }
.task-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--space-6); align-items: start; }
.task-layout.one { grid-template-columns: minmax(0, 1fr); max-width: 860px; }
.task-main .panel:last-child, .task-side .panel:last-child { margin-bottom: 0; }
.stack-lg { display: grid; gap: var(--space-5); }
.section-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
.ask-panel .question { font-size: 1.0625rem; font-weight: 500; line-height: 1.45; }
.side-list { display: grid; }
.side-link { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px var(--space-5); border-top: 1px solid var(--border); text-decoration: none; color: inherit; }
.side-list .side-link:first-child { border-top: 0; }
a.side-link:hover { background: var(--surface-hover); }
.side-link span { display: grid; min-width: 0; }
.side-link b { font-weight: 500; font-size: var(--text-sm); }
.side-link small { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-link i { font-style: normal; color: var(--text-muted); }
.side-link.off b { color: var(--text-muted); }
.side-kv { padding: var(--space-3) var(--space-5) var(--space-4); border-top: 1px solid var(--border); margin: 0; grid-template-columns: 110px 1fr; font-size: var(--text-xs); }
.side-kv .mono { font-family: var(--font-mono); word-break: break-all; }
.side-actions { border-top: 1px solid var(--border); }
.timeline { list-style: none; margin: 0; padding: var(--space-3) var(--space-5) var(--space-4); }
.timeline li { display: flex; justify-content: space-between; gap: var(--space-3); padding: 5px 0 5px 18px; position: relative; font-size: var(--text-sm); color: var(--text-muted); }
.timeline li::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; border: 1px solid var(--border-strong); }
.timeline li.done { color: var(--text-secondary); }
.timeline li.done::before { background: var(--text-primary); border-color: var(--text-primary); }
.timeline li.now { color: var(--text-primary); font-weight: 500; }
.timeline li.now::before { border-color: var(--text-primary); box-shadow: 0 0 0 3px rgba(255, 255, 255, .12); }
.timeline small { font-size: var(--text-xs); color: var(--text-muted); font-weight: 400; }

.ico { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.badge .ico { width: 13px; height: 13px; vertical-align: -2px; }
.badge.you { gap: 5px; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-secondary); white-space: nowrap; }
.st.muted { color: var(--text-muted); }
.stat { display: inline-flex; align-items: center; gap: 6px; }
.stat b { margin: 0; }
.toggle-stat { font: inherit; color: var(--text-secondary); }
.t-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.t-title { font-weight: 500; color: var(--text-primary); font-size: 0.95rem; }
.tag { font-size: var(--text-xs); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; line-height: 1.5; }
.tasks td { padding: 14px var(--space-5); }
.tasks .col-task { width: auto; }
.tasks .col-stage { width: 150px; }
.tasks .col-status { width: 150px; }
.tasks .col-links { width: 150px; }
.tasks .col-when { width: 64px; text-align: right; color: var(--text-muted); }
.ilinks { display: flex; gap: 6px; }
.ilink { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-secondary); text-decoration: none; font-size: var(--text-xs); }
.ilink:hover { border-color: var(--text-muted); color: var(--text-primary); background: var(--surface-raised); }
.ilink.off { border-style: dashed; color: var(--text-muted); }
.sdot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid currentColor; }
.sdot.on { background: var(--text-primary); border-color: var(--text-primary); }
.orch { display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-5); }
.orch > .ico { margin-top: 3px; color: var(--text-muted); }
.orch-main { flex: 1; min-width: 0; }
.orch-flight { font-size: var(--text-sm); color: var(--text-secondary); margin: 2px 0 6px; }
.side-link .lead { color: var(--text-muted); }
.side-link .trail { color: var(--text-muted); width: 14px; height: 14px; }
.side-link { justify-content: flex-start; }
.side-link span { flex: 1; }
.side-kv dt { display: flex; align-items: center; gap: 6px; }
.side-kv dt .ico { width: 13px; height: 13px; }
summary .ico { width: 14px; height: 14px; }

html { font-size: 86.6%; }
.repo { color: var(--text-muted); font-weight: 400; margin-right: 8px; }
.sicon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: var(--text-secondary); }
.sicon.muted { color: var(--text-muted); }
.sicon.you { background: var(--text-primary); color: var(--text-inverse); }
.sicon .ico { width: 14px; height: 14px; vertical-align: 0; }
.tasks .col-status { width: 56px; }

.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs:empty { display: none; }
.thumb { position: relative; width: 72px; height: 72px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface-inset); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.loading img { opacity: .4; }
.thumb em { position: absolute; inset: auto 0 0 0; font: var(--text-xs) var(--font-sans); font-style: normal; background: rgba(0,0,0,.7); color: var(--danger); text-align: center; }
.thumb-x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0; line-height: 18px; border-radius: 50%; background: rgba(0,0,0,.7); border-color: transparent; font-size: 14px; }
.attach-btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; width: 36px; border: 1px solid var(--border-strong); border-radius: var(--r); cursor: pointer; color: var(--text-secondary); }
.attach-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
form.reply.drop textarea { border-color: var(--text-primary); border-style: dashed; }

.modal-overlay { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .62); backdrop-filter: blur(3px); animation: fade .12s ease; }
.modal { width: min(560px, 100%); max-height: 86vh; overflow: auto; background: var(--surface-card); border: 1px solid var(--border-strong); border-radius: var(--r-lg); padding: var(--space-5) var(--space-6); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .8); animation: pop .14s ease; }
.modal h3 { margin: 0 0 var(--space-4); font-size: var(--text-xl); font-weight: 600; }
.modal-body { display: grid; gap: var(--space-3); }
.modal-body p { margin: 0; }
.modal-body .quote { max-height: 40vh; overflow: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }
button.primary.danger { background: var(--danger); border-color: var(--danger); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.sicon.pending { color: var(--text-primary); border: 1px solid var(--text-primary); animation: ring 1.4s ease-out infinite; }
.sicon.resolved { background: var(--text-primary); color: var(--text-inverse); animation: pop .3s ease; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.45); } 100% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } }
.row-ask .ico { width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; }
.row-ask.live { color: var(--text-primary); }
.row-ask.live .ico { animation: blink 1.2s ease-in-out infinite; }
.row-ask.ok { color: var(--text-primary); }
@keyframes blink { 50% { opacity: .3; } }
tr.flash td { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: rgba(255,255,255,.12); } 100% { background: transparent; } }
.tracker { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin: 0; padding: 0; }
.tracker li { border-top: 2px solid var(--border-strong); padding-top: 8px; font-size: var(--text-sm); color: var(--text-muted); display: grid; gap: 2px; }
.tracker li i { display: none; }
.tracker li small { font-size: var(--text-xs); color: var(--text-muted); }
.tracker li.done { border-color: var(--text-primary); color: var(--text-secondary); }
.tracker li.now { border-color: var(--text-primary); color: var(--text-primary); animation: blink 1.2s ease-in-out infinite; }
.tracker li.wait { border-color: var(--text-muted); color: var(--text-secondary); }
.tracker li.alert { border-color: var(--danger); color: var(--danger); }

#toast-root { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 900; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--text-primary); color: var(--text-inverse); font-size: var(--text-sm); font-weight: 500; box-shadow: 0 12px 30px -10px rgba(0,0,0,.7); animation: drop .2s ease; }
.toast .ico { width: 14px; height: 14px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

.panel-head h2 .ico { width: 15px; height: 15px; margin-right: 8px; color: var(--text-muted); vertical-align: -2px; }
.small { font-size: var(--text-xs); }

.opts { display: grid; gap: var(--space-2); }
.opt { display: grid; gap: 3px; text-align: left; padding: 12px 14px; white-space: normal; }
.opt b { font-weight: 500; }
.opt b em { font-style: normal; font-size: var(--text-xs); color: var(--text-muted); margin-left: 6px; }
.opt small { font-size: var(--text-xs); color: var(--text-secondary); font-weight: 400; line-height: 1.45; }
.opt.rec { border-color: var(--text-primary); }
.opt:hover { background: var(--surface-raised); }

a.ref { color: var(--text-primary); text-decoration-style: dotted; }
.ref-title { color: var(--text-secondary); font-weight: 400; }

@media (max-width: 899px) {
  .tasks .col-stage { display: none; }
  .task-layout { grid-template-columns: 1fr; }
  .page { padding: 16px 16px 32px; }
  .tasks .col-links, .tasks .col-when { display: none; }
  .milestones { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .log li { grid-template-columns: 1fr; gap: 2px; }
  .kv { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="modal-root"></div>
<div id="toast-root"></div>
<main class="page" id="app"><div class="empty">Загружаю…</div></main>
<script>
const STAGES = {"launched": "Запуск", "spec-drafted": "Спецификация", "plan-passed": "План", "gate-round": "Ревью",
  "pre-publish": "Публикация", "pre-merge": "Мерж", "closed": "Закрыта", "intent-moved": "Смена цели"};
const drafts = new Map(), receipts = new Map(), openDetails = new Set(), attachments = new Map(), flashed = new Set();
let last = null, lastKey = "", pendingRender = false, loading = false, showClosed = false, updatedAt = null;
const busy = new Map();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

const issues = new Map(), issuesAsked = new Set();
let ctxRepo = "";

function knownRepos() {
  const set = new Set(["notifier", "go-libs"]);
  (last ? last.streams : []).forEach(s => { const r = repoOf(s); if (r) set.add(r); });
  return set;
}

function issueLink(id) {
  issuesAsked.add(id);
  const info = issues.get(id) || {};
  const url = info.url || `https://linear.app/mercuryo/issue/${id}`;
  return `<a class="ref" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(info.title || "")}">${id}</a>`;
}

// Task ids and PR numbers in orchestrator text become links; text inside links and code is left alone.
function linkify(html) {
  const repos = knownRepos();
  return html.split(/(<a\b[^>]*>.*?<\/a>|<code>.*?<\/code>|<[^>]+>)/).map((part, i) => {
    if (i % 2) return part;
    part = part.replace(/\b([a-z][a-z0-9-]+) #(\d+)\b/g, (m, repo, n) => repos.has(repo)
      ? `<a class="ref" href="https://github.com/MercuryoPro/${repo}/pull/${n}" target="_blank" rel="noopener">${repo} #${n}</a>` : m);
    part = part.replace(/\bPR #(\d+)\b/g, (m, n) => ctxRepo
      ? `<a class="ref" href="https://github.com/MercuryoPro/${ctxRepo}/pull/${n}" target="_blank" rel="noopener">PR #${n}</a>` : m);
    return part.replace(/\b(MER-\d+)\b/g, (m, id) => issueLink(id));
  }).join("");
}

function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return linkify(s);
}

// The question headline also spells out each task's title, so an id alone never has to be decoded.
function withTitles(html) {
  return html.replace(/(<a class="ref"[^>]*>(MER-\d+)<\/a>)/g, (m, a, id) => {
    const t = (issues.get(id) || {}).title;
    return t ? `${a} <span class="ref-title">· ${esc(t)}</span>` : a;
  });
}

async function loadIssues() {
  const want = [...issuesAsked].filter(id => !issues.has(id) || !issues.get(id).title);
  if (!want.length) return;
  try {
    const res = await fetch("/api/issues?ids=" + want.join(","), {cache: "no-store"});
    const data = await res.json();
    let changed = false;
    Object.entries(data).forEach(([id, info]) => {
      if (info && info.title && (issues.get(id) || {}).title !== info.title) changed = true;
      if (info) issues.set(id, info);
    });
    if (changed && !editing()) safeRender();
  } catch (e) { /* titles are a nicety */ }
}

function md(text) {
  const out = [], lines = String(text || "").split("\n");
  const special = /^(```|\s*\||\s*[-*] |\s*\d+\. |#{1,4} )/;
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (l.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const [headRow, ...rest] = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<table><tr>" + cells(headRow).map(c => `<th>${inline(c)}</th>`).join("") + "</tr>" +
        rest.map(r => "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    const listRe = /^\s*([-*]|\d+\.) /;
    if (listRe.test(l)) {
      const ordered = /^\s*\d+\. /.test(l), items = [];
      while (i < lines.length && listRe.test(lines[i])) items.push(lines[i++].replace(listRe, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map(t => `<li>${inline(t)}</li>`).join("") + `</${tag}>`); continue;
    }
    if (/^#{1,4} /.test(l)) { out.push(`<p><b>${inline(l.replace(/^#+ /, ""))}</b></p>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !special.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

function when(ts) {
  if (!ts) return "";
  const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
  return isNaN(d) ? esc(ts) : d.toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
}

function ago(ts) {
  if (!ts) return "—";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} ч назад` : `${Math.round(h / 24)} дн назад`;
}

const route = () => {
  const h = location.hash.replace(/^#\/?/, "");
  const [kind, id] = h.split("/");
  return {kind: kind || "home", id: decodeURIComponent(id || "")};
};

function titleOf(s) {
  return (s.links.linear || {}).title || s.header.branch || s.id;
}

function linksOf(s) {
  const lin = s.links.linear || {}, pr = s.links.pr || {}, w = s.workspace || {}, out = [];
  const web = (w.info || {}).web || {};
  if (pr.url) out.push(`<a href="${esc(pr.url)}" target="_blank" rel="noopener">PR #${esc(pr.number)}</a>`);
  if (lin.url) out.push(`<a href="${esc(lin.url)}" target="_blank" rel="noopener">Linear</a>`);
  if (web.console) out.push(`<a href="${esc(web.console)}" target="_blank" rel="noopener">Стенд</a>`);
  return `<span class="links">${out.join("")}</span>`;
}

function stage(s) {
  const idx = s.progress.index;
  const bars = last.checkpoints.map((c, i) =>
    `<i class="${i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : ""}" title="${esc(STAGES[c] || c)}"></i>`).join("");
  const label = idx >= 0 ? STAGES[last.checkpoints[idx]] : "—";
  return `<div class="stage"><div class="bar">${bars}</div>
    <span class="stage-label">${esc(label)} · ${Math.max(idx + 1, 0)}/${last.checkpoints.length}${s.progress.intent_moved ? " · цель сдвинулась" : ""}</span></div>`;
}

const APP = {running: "запущен", stopped: "остановлен"};

function statusBadge(s) {
  if (s.closed) return `<span class="badge quiet">Закрыта</span>`;
  if (s.owner_asks.length) return `<span class="badge you dot">Ждёт тебя</span>`;
  if (s.derived["owed by"] === "the orchestrator") return `<span class="badge dot">У оркестратора</span>`;
  return `<span class="badge">В работе</span>`;
}

function det(key, summary, body) {
  return `<details data-key="${esc(key)}" ${openDetails.has(key) ? "open" : ""}><summary>${summary}</summary>${body}</details>`;
}

function sessionOf(name) {
  return (last.orchestrators.find(o => o.name === name) || {}).session_id || "";
}

function attachList(key) {
  return (attachments.get(key) || []).map((a, i) => `<span class="thumb ${a.path ? "" : "loading"}" title="${esc(a.error || a.name)}">
      <img src="${esc(a.url)}" alt="">${a.error ? `<em>ошибка</em>` : ""}
      <button type="button" class="thumb-x" data-unattach="${i}" title="Убрать">×</button></span>`).join("");
}

function replyForm(key, sessionId, stream, asks, kind = "reply") {
  const rc = receipts.get(key) || {};
  const hint = kind === "note" ? "Что заметил: файл, решение, подход. Картинку можно вставить ⌘V"
    : `Ответ оркестратору${stream ? " по " + esc(stream) : ""}. Картинку можно вставить ⌘V или перетащить`;
  return `<form class="reply stack" data-key="${esc(key)}" data-session="${esc(sessionId)}" data-stream="${esc(stream)}" data-kind="${kind}" data-asks="${esc(JSON.stringify(asks || []))}">
    <textarea name="text" placeholder="${hint}">${esc(drafts.get(key) || "")}</textarea>
    <div class="thumbs">${attachList(key)}</div>
    <div class="row-actions">
      <button type="submit" class="primary">Отправить</button>
      ${kind === "note" ? "" : `<button type="button" data-quick="Принимаю">Принимаю</button>`}
      <label class="attach-btn" title="Прикрепить картинку">${icon("image")}<input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden data-attach></label>
      <span class="receipt ${rc.cls || ""}">${esc(rc.text || "")}</span>
    </div></form>`;
}

async function addImages(form, files) {
  const key = form.dataset.key, list = attachments.get(key) || [];
  attachments.set(key, list);
  const imgs = [...files].filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type));
  for (const file of imgs) {
    const a = {name: file.name || "картинка", url: URL.createObjectURL(file), path: ""};
    list.push(a);
    redrawThumbs(form);
    try {
      const res = await fetch("/api/upload", {method: "POST", headers: {"Content-Type": file.type}, body: file});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      a.path = data.path;
    } catch (err) {
      a.error = err.message;
    }
    redrawThumbs(form);
  }
}

function redrawThumbs(form) {
  const live = document.querySelector(`form.reply[data-key="${CSS.escape(form.dataset.key)}"] .thumbs`);
  if (live) live.innerHTML = attachList(form.dataset.key);
}

function askPanel(key, items, ask, session, stream, rs) {
  const origin = ask.origin
    ? `<div class="quote">${md(ask.origin.text)}</div><div class="quote-meta">сообщение оркестратора · ${esc(when(ask.origin.ts))}</div>`
    : `<div class="muted">Сообщение с вопросом не найдено в транскрипте.</div>`;
  const updates = (ask.updates || []).length
    ? det(key + ":updates", `Обновления после вопроса · ${ask.updates.length}`,
        `<div class="stack">${ask.updates.map(u => `<div><div class="quote">${md(u.paragraphs.join("\n\n"))}</div><div class="quote-meta">${esc(when(u.ts))}</div></div>`).join("")}</div>`)
    : "";
  const track = rs && rs.kind !== "resolved" ? tracker(rs) : "";
  return `<section class="panel ask-panel"><div class="panel-head"><h2>Вопрос к тебе</h2></div>
    <div class="panel-body stack-lg">${track}
      <div class="question">${items.map(i => `<div>${withTitles(inline(i))}</div>`).join("")}</div>
      <div>${origin}</div>${updates}
      <div><div class="section-label">Ответ</div>${replyForm(key, session, stream, items)}</div>
    </div></section>`;
}

function promptPanel(s) {
  const p = s.prompt;
  if (!p) return "";
  if (p.error) return `<section class="panel"><div class="panel-body error">Сессия ждёт ввода, но экран не прочитан: ${esc(p.error)}</div></section>`;
  const [title, ...rest] = p.question;
  const pickable = p.options.filter(o => !/^(type something|chat about this)/i.test(o.label));
  const free = p.options.some(o => /^type something/i.test(o.label));
  const opts = pickable.map(o => `<button type="button" class="opt ${/recommended/i.test(o.label) ? "rec" : ""}" data-pick="${esc(o.key)}" data-stream="${esc(s.id)}" data-label="${esc(o.label)}">
      <b>${esc(o.label.replace(/\s*\(Recommended\)/i, ""))}${/recommended/i.test(o.label) ? ` <em>рекомендует</em>` : ""}</b>${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</button>`).join("");
  const own = free ? `<form class="term-text stack" data-stream="${esc(s.id)}" data-key="t:${esc(s.id)}">
      <textarea placeholder="Свой ответ — уйдёт в терминал сессии">${esc(drafts.get("t:" + s.id) || "")}</textarea>
      <div class="row-actions"><button type="submit">Ответить своим текстом</button></div></form>` : "";
  return `<section class="panel ask-panel"><div class="panel-head"><h2>${icon("terminal")}Сессия ждёт ввода</h2>
      <span class="right muted small">вопрос задала сессия задачи в своём терминале</span></div>
    <div class="panel-body stack-lg">
      <div><div class="question">${esc(title || "Вопрос в терминале")}</div>${rest.length ? `<p class="muted" style="margin:6px 0 0">${esc(rest.join(" "))}</p>` : ""}</div>
      <div class="opts">${opts}</div>${own}
      ${det(s.id + ":screen", "экран терминала", `<pre>${esc(p.screen || "")}</pre>`)}
    </div></section>`;
}

function notePanel(s) {
  if (s.closed) return "";
  return `<section class="panel"><div class="panel-head"><h2>${icon("pen")}Комментарий</h2>
      <span class="right muted small">оркестратор передаст его потоку</span></div>
    <div class="panel-body">${replyForm("n:" + s.id, sessionOf(s.orchestrator), s.id, [], "note")}</div></section>`;
}

function sideLink(label, sub, url, ic) {
  const lead = ic ? icon(ic, "lead") : "";
  return url
    ? `<a class="side-link" href="${esc(url)}" target="_blank" rel="noopener">${lead}<span><b>${label}</b><small>${esc(sub)}</small></span>${icon("out", "trail")}</a>`
    : `<div class="side-link off">${lead}<span><b>${label}</b><small>${esc(sub)}</small></span></div>`;
}

function linksPanel(s) {
  const lin = s.links.linear || {}, pr = s.links.pr || {}, h = s.header;
  return `<section class="panel"><div class="panel-head"><h2>Ссылки</h2></div><div class="side-list">
    ${pr.url ? sideLink(`PR #${esc(pr.number)}`, [pr.state && pr.state.toLowerCase(), pr.title].filter(Boolean).join(" · "), pr.url, "pr") : sideLink("PR", "ещё не открыт", "", "pr")}
    ${sideLink(esc(h.tracker || s.id), lin.state || "Linear", lin.url, "linear")}
    </div>
    <dl class="kv side-kv"><dt>${icon("branch")}Ветка</dt><dd class="mono">${esc(h.branch || "—")}</dd>
      <dt>${icon("folder")}Worktree</dt><dd class="mono">${esc((h.repository || "—").replace(/^\/Users\/[^/]+/, "~"))}</dd></dl></section>`;
}

function contourPanel(s) {
  const w = s.workspace || {};
  if (!w.available) return "";
  const info = w.info || {}, web = info.web || {}, st = info.status || {};
  const up = w.app_up, starting = up && up.running, app = st.application;
  const badge = starting ? `<span class="badge dot">запускается</span>`
    : app === "running" ? `<span class="badge you dot">запущен</span>`
    : app ? `<span class="badge">${esc(APP[app] || app)}</span>` : "";
  const b = busy.get(s.id) || "";
  let body;
  if (w.loading) body = `<div class="panel-body muted">Читаю task workspace:info…</div>`;
  else if (w.error) body = `<div class="panel-body error">${esc(w.error)}</div>`;
  else body = `<div class="side-list">
      ${sideLink("Console", (web.console || "").replace(/^https?:\/\//, ""), web.console, "layout")}
      ${sideLink("Admin", (web.admin || "").replace(/^https?:\/\//, ""), web.admin, "shield")}
      ${sideLink("DbGate", (web.dbgate || "").replace(/^https?:\/\//, ""), web.dbgate, "db")}
      ${sideLink("API", (web.api || "").replace(/^https?:\/\//, ""), web.api, "code")}
      ${sideLink("RabbitScout", (web.rabbitscout || "").replace(/^https?:\/\//, ""), web.rabbitscout, "layers")}</div>
    <dl class="kv side-kv"><dt>Инфраструктура</dt><dd>${esc(APP[st.infrastructure] || st.infrastructure || "—")}</dd>
      <dt>Проверено</dt><dd>${esc(when(w.checked))}</dd></dl>`;
  const log = up ? `<div class="panel-body">${det(s.id + ":appup", `Вывод app:up${up.running ? " (идёт)" : ` · код ${esc(up.exit_code)}`}`, `<pre>${esc(up.tail || "")}</pre>`)}</div>` : "";
  const actions = `<div class="panel-body row-actions side-actions">
      <button type="button" class="primary" data-ws="up" data-stream="${esc(s.id)}" ${b || starting || app === "running" ? "disabled" : ""}>${starting || b === "up" ? "Запускается…" : "Запустить app:up"}</button>
      <button type="button" data-ws="refresh" data-stream="${esc(s.id)}" ${b ? "disabled" : ""}>${b === "refresh" ? "Обновляю…" : "Обновить"}</button></div>`;
  return `<section class="panel"><div class="panel-head"><h2>Стенд</h2><span class="right">${badge}</span></div>${body}${actions}${log}</section>`;
}

function stagesPanel(s) {
  const idx = s.progress.index;
  const reached = new Map(s.milestones.map(m => [m.checkpoint, m.ts]));
  const rows = last.checkpoints.map((c, i) => {
    const cls = i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : "";
    return `<li class="${cls}"><span>${esc(STAGES[c] || c)}</span><small>${reached.get(c) ? esc(when(reached.get(c))) : ""}</small></li>`;
  }).join("");
  return `<section class="panel"><div class="panel-head"><h2>Этапы</h2><span class="right muted">${Math.max(idx + 1, 0)}/${last.checkpoints.length}</span></div>
    <ol class="timeline">${rows}</ol></section>`;
}

function journalPanel(s) {
  const rows = [...s.events].reverse().map(e => e.kind === "checkpoint"
    ? `<li><span class="muted">${esc(when(e.ts))}</span><div><span class="cp">${esc(STAGES[e.checkpoint] || e.checkpoint)} · ${e.direction === "in" ? "от потока" : "ответ"}</span><div>${esc(e.text)}</div></div></li>`
    : `<li class="note"><span>${esc(when(e.ts))}</span><div>${esc(e.text)}</div></li>`).join("");
  return `<section class="panel"><div class="panel-head"><h2>Журнал</h2><span class="count">${s.events.length}</span></div>
    <div class="panel-body"><ul class="log">${rows}</ul></div></section>`;
}

function taskView(s) {
  const err = s.error ? `<div class="error">${esc(s.error)}</div>` : "";
  const rs = streamReply(s);
  const idle = s.closed ? "" : rs && rs.kind === "resolved"
    ? `<section class="panel"><div class="panel-head"><h2>Вопрос снят</h2></div><div class="panel-body">${tracker(rs)}</div></section>`
    : "";
  return `<a class="back" href="#/">← Все задачи</a>
    <header class="task-head"><div class="task-head-top"><span class="id">${esc(s.id)}</span>${statusCell(s)}
      ${s.last_ts ? `<span class="st muted">${icon("clock")}${esc(ago(s.last_ts))}</span>` : ""}${splitTitle(titleOf(s)).tags.filter(t => t !== repoOf(s)).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <h1 class="big">${repoOf(s) ? `<span class="repo">${esc(repoOf(s))}</span>` : ""}${esc(splitTitle(titleOf(s)).title)}</h1>${err}</header>
    <div class="task-layout">
      <div class="task-main">${promptPanel(s)}${s.owner_asks.length ? askPanel("s:" + s.id, s.owner_asks, s.ask || {}, sessionOf(s.orchestrator), s.id, rs) : idle}${notePanel(s)}${s.prepared ? "" : journalPanel(s)}</div>
      <aside class="task-side">${linksPanel(s)}${contourPanel(s)}${s.prepared ? "" : stagesPanel(s)}</aside>
    </div>`;
}

function generalView(g) {
  return `<a class="back" href="#/">← Все задачи</a>
    <header class="task-head"><div class="task-head-top"><span class="id">вопрос без задачи</span><span class="badge you dot">Ждёт тебя</span></div>
      <h1 class="big">${inline(g.item)}</h1></header>
    <div class="task-layout one">${askPanel("g:" + g.id, [g.item], g.ask || {}, sessionOf(g.orchestrator), "", replyState("", g.orchestrator, true, g.item))}</div>`;
}

const ICONS = {
  pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  linear: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/>',
  server: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01"/><path d="M6 18h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  ask: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  bot: '<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><path d="M8 16h.01"/><path d="M16 16h.01"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',

function icon(name, cls = "") {
  return `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

function splitTitle(t) {
  // "[console][admin] Tables: …" → tags ["console", "admin"], title "Tables: …"
  const tags = [];
  let rest = String(t || "");
  let m;
  while ((m = rest.match(/^\s*\[([^\]]+)\]\s*/))) { tags.push(m[1]); rest = rest.slice(m[0].length); }
  return {tags, title: rest};
}

function repoOf(s) {
  const path = s.header.repository || "";
  const m = path.match(/\/workspaces\/([^/]+)\//) || path.match(/\/([^/]+)\/?$/);
  if (m) return m[1];
  const pr = (s.links.pr || {}).url || "";
  return (pr.match(/github\.com\/[^/]+\/([^/]+)\//) || [])[1] || "";
}

function titleHtml(s) {
  const repo = repoOf(s);
  return `${repo ? `<span class="repo">${esc(repo)}</span>` : ""}<span class="t-title">${esc(splitTitle(titleOf(s)).title)}</span>`;
}

function short(ts) {
  if (!ts) return "—";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "сейчас";
  if (m < 60) return `${m} мин`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} ч` : `${Math.round(h / 24)} дн`;
}

function iconLinks(s) {
  const lin = s.links.linear || {}, pr = s.links.pr || {}, w = s.workspace || {};
  const web = (w.info || {}).web || {}, app = ((w.info || {}).status || {}).application;
  const a = (url, title, html, cls = "") => `<a class="ilink ${cls}" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}">${html}</a>`;
  const out = [];
  out.push(pr.url ? a(pr.url, `PR #${pr.number} · ${(pr.state || "").toLowerCase()}`, `${icon("pr")}<span>${esc(pr.number)}</span>`)
    : `<span class="ilink off" title="PR ещё нет">${icon("pr")}<span>—</span></span>`);
  if (lin.url) out.push(a(lin.url, `Linear · ${lin.state || ""}`, icon("linear")));
  if (web.console) out.push(a(web.console, `Стенд · ${APP[app] || app || ""}`, `${icon("server")}<i class="sdot ${app === "running" ? "on" : ""}"></i>`));
  return `<span class="ilinks">${out.join("")}</span>`;
}

function tsMs(ts) {
  if (!ts) return 0;
  const v = Date.parse(String(ts).replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
  return isNaN(v) ? 0 : v;
}

function orchOf(name) {
  return last.orchestrators.find(o => o.name === name) || {};
}

// What happened to the owner's latest reply on a stream: pending, again (a turn ended and the
// ask is still there), resolved (the ask left the waiting line), or nothing to show.
const stemsOf = t => new Set((String(t || "").match(/[\p{L}\p{N}_-]{4,}/gu) || []).filter(w => !/^\d+$/.test(w)).map(w => w.toLowerCase().slice(0, 6)));

function similar(a, b) {
  const sa = stemsOf(a), sb = stemsOf(b);
  if (!sa.size || !sb.size) return false;
  let n = 0;
  sa.forEach(w => { if (sb.has(w)) n++; });
  return n / Math.min(sa.size, sb.size) >= 0.5;
}

// item: for a general ask, only a reply naming that same question counts.
function replyState(streamId, orchName, asked, item) {
  const r = [...(last.replies || [])].reverse().find(x => x.ok && x.stream === streamId && (!x.kind || x.kind === "reply")
    && (!item || (x.asks || []).some(a => similar(a, item)) || (!x.asks && similar(x.text, item))));
  if (!r) return null;
  const sent = tsMs(r.ts), o = orchOf(orchName), turn = tsMs(o.message_ts);
  const busy = o.session_status === "busy";
  if (asked) {
    // A busy orchestrator may still be reading the reply; judge only a turn that has ended.
    if (turn > sent + 3000 && !busy) return {kind: "again", r};
    return {kind: "pending", r, reading: busy};
  }
  if (turn > sent && Date.now() - sent < 10 * 60000) return {kind: "resolved", r, at: turn};
  return null;
}

const streamReply = s => replyState(s.id, s.orchestrator, s.owner_asks.length > 0);

function tracker(rs) {
  if (!rs) return "";
  const steps = [
    ["Отправлено", "done", when(rs.r.ts)],
    ["Оркестратор читает", rs.kind === "pending" ? (rs.reading ? "now" : "wait") : "done", rs.kind === "pending" && !rs.reading ? "в очереди" : ""],
    [rs.kind === "again" ? "Снова нужен ответ" : "Вопрос снят", rs.kind === "resolved" ? "done" : rs.kind === "again" ? "alert" : "", rs.kind === "resolved" ? when(rs.at) : ""],
  ];
  return `<ol class="tracker">${steps.map(([t, st, sub]) => `<li class="${st}"><i></i><span>${esc(t)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</li>`).join("")}</ol>`;
}

function statusIcon(s) {
  const one = (name, title, cls = "") => `<span class="sicon ${cls}" title="${title}">${icon(name)}</span>`;
  const rs = streamReply(s);
  if (rs && rs.kind === "pending") return one("send", rs.reading ? "оркестратор читает ответ" : "ответ отправлен", "pending");
  if (rs && rs.kind === "resolved") return one("check", "вопрос снят", "resolved");
  if (s.closed) return one("check", "закрыта", "muted");
  if (s.prompt && !s.prompt.error) return one("terminal", "ждёт ввода в терминале", "you");
  if (s.owner_asks.length) return one("ask", "ждёт тебя", "you");
  if (s.prepared) return one("hourglass", "готовится к запуску", "muted");
  if (s.derived["owed by"] === "the orchestrator") return one("hourglass", "у оркестратора");
  return one("activity", "в работе", "muted");
}

function statusCell(s) {
  if (s.closed) return `<span class="st muted">${icon("check")}закрыта</span>`;
  if (s.prepared && !s.owner_asks.length) return `<span class="st muted">${icon("hourglass")}готовится к запуску</span>`;
  if (s.prompt && !s.prompt.error) return `<span class="badge you">${icon("terminal")}Ждёт ввода</span>`;
  if (s.owner_asks.length) return `<span class="badge you">${icon("ask")}Ждёт тебя</span>`;
  if (s.derived["owed by"] === "the orchestrator") return `<span class="st">${icon("hourglass")}у оркестратора</span>`;
  return `<span class="st muted">${icon("activity")}в работе</span>`;
}

function stageCell(s) {
  if (s.prepared) return `<div class="stage"><span class="stage-label">готовится к запуску</span></div>`;
  const idx = s.progress.index;
  const bars = last.checkpoints.map((c, i) =>
    `<i class="${i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : ""}" title="${esc(STAGES[c] || c)}"></i>`).join("");
  return `<div class="stage"><div class="bar">${bars}</div><span class="stage-label">${esc(idx >= 0 ? STAGES[last.checkpoints[idx]] : "—")}</span></div>`;
}

function inFlight(status) {
  const seg = String(status || "").split(" · ").find(x => x.trim().startsWith("in flight:"));
  return seg ? seg.replace(/^\s*in flight:\s*/, "") : "";
}

function dropId(text, id) {
  // The row already names the task; "(MER-1)" inside its own ask is noise.
  return String(text).replace(new RegExp(`\\s*\\(${id}\\)`, "g"), "").trim();
}

function homeView() {
  const d = last;
  const openS = d.streams.filter(s => !s.closed), closedS = d.streams.filter(s => s.closed);
  const nAsks = openS.filter(s => s.owner_asks.length || (s.prompt && !s.prompt.error)).length + d.general_asks.length;
  const shown = showClosed ? openS.concat(closedS) : openS;
  const row = s => {
    const rs = streamReply(s);
    const pq = s.prompt && !s.prompt.error ? (s.prompt.question[1] || s.prompt.question[0] || "вопрос в терминале") : "";
    const line = pq ? `<div class="row-ask live">${icon("terminal")}ждёт ввода в терминале: ${esc(pq)}</div>`
      : rs && rs.kind === "pending" ? `<div class="row-ask live">${icon("send")}ответ отправлен · ${rs.reading ? "оркестратор читает…" : "ждёт оркестратора…"}</div>`
      : rs && rs.kind === "resolved" ? `<div class="row-ask ok">${icon("check")}вопрос снят</div>`
      : s.owner_asks.length ? `<div class="row-ask">${rs && rs.kind === "again" ? "снова нужен ответ · " : ""}${s.owner_asks.map(a => inline(dropId(a, s.id))).join(" · ")}</div>` : "";
    // Flash a resolved row once, not on every later re-render.
    const flashKey = rs && rs.kind === "resolved" ? s.id + rs.r.ts : "";
    const flash = flashKey && !flashed.has(flashKey);
    if (flash) flashed.add(flashKey);
    return `<tr class="row ${flash ? "flash" : ""}" data-href="#/task/${esc(encodeURIComponent(s.id))}">
      <td class="col-task"><div class="t-line"><span class="id">${esc(s.id)}</span>${titleHtml(s)}</div>${line}</td>
      <td class="col-stage">${stageCell(s)}</td><td class="col-status">${statusIcon(s)}</td>
      <td class="col-links">${iconLinks(s)}</td>
      <td class="col-when" title="${esc(when(s.last_ts))}">${esc(short(s.last_ts))}</td></tr>`;
  };
  const general = d.general_asks.map(g => `<tr class="row" data-href="#/ask/${esc(encodeURIComponent(g.id))}">
      <td class="col-task"><div class="t-line"><span class="id">вопрос</span><span class="t-title">${inline(g.item)}</span></div></td>
      <td class="col-stage"></td><td class="col-status"><span class="sicon you" title="ждёт тебя">${icon("ask")}</span></td>
      <td class="col-links"></td><td class="col-when">${esc(short((g.ask && g.ask.origin || {}).ts))}</td></tr>`).join("");
  const needsYou = s => s.owner_asks.length || (s.prompt && !s.prompt.error);
  const waitingRows = shown.filter(needsYou).map(row).join("");
  const rows = shown.filter(s => !needsYou(s)).map(row).join("");
  const orch = d.orchestrators.map(o => {
    const flight = inFlight(o.status_line);
    return `<div class="orch">${icon("bot")}<div class="orch-main"><div><b>${esc(o.name.split("/").pop())}</b>
        <span class="muted">· ${esc(short(o.message_ts))}</span></div>
        ${o.error ? `<div class="error">${esc(o.error)}</div>` : `<div class="orch-flight">${flight ? inline(flight) : "ничего не запущено"}</div>`}
        ${det("orch:" + o.name, "последнее сообщение", `<div class="quote">${md(o.message)}</div>`)}</div></div>`;
  }).join("");
  const replies = [...(d.replies || [])].reverse().map(r =>
    `<li class="${r.ok ? "" : "note"}"><span>${esc(when(r.ts))}</span><div>${r.ok ? "" : "не доставлено: "}${esc(r.text.replace(/^\[desk\]\s*/, ""))}${r.error ? " — " + esc(r.error) : ""}</div></li>`).join("");
  return `<div class="page-head"><div><h1>Задачи</h1><div class="sub" id="sub"></div></div>
      <div class="stats"><span class="stat" title="ждут тебя">${icon("ask")}<b>${nAsks}</b></span><span class="stat" title="в работе">${icon("activity")}<b>${openS.length}</b></span>
        <button class="stat toggle-stat" id="toggle-closed" type="button" title="${showClosed ? "Скрыть закрытые" : "Показать закрытые"}">${icon("check")}<b>${closedS.length}</b></button></div></div>
    <section class="panel"><table class="tasks"><tbody>${waitingRows + general + rows || `<tr><td class="empty">Нет задач.</td></tr>`}</tbody></table></section>
    <section class="panel">${orch}</section>
    ${replies ? `<section class="panel"><div class="panel-body">${det("replies", `${icon("send")} отправленные ответы · ${d.replies.length}`, `<ul class="log">${replies}</ul>`)}</div></section>` : ""}`;
}

// A stale link: go to the task list and say why, instead of an empty page.
function leave(message) {
  history.replaceState(null, "", location.pathname + location.search + "#/");
  toast(message);
  render();
}

let toastTimer = 0;
function toast(message) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${icon("check")}<span>${esc(message)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const t = root.querySelector(".toast");
    if (t) { t.classList.add("out"); setTimeout(() => { root.innerHTML = ""; }, 250); }
  }, 4000);
}

function render() {
  if (!last) return;
  const r = route();
  let html;
  ctxRepo = "";
  if (r.kind === "task") {
    const s = last.streams.find(x => x.id === r.id);
    if (s) ctxRepo = repoOf(s);
    if (!s) return leave(`Задачи ${r.id} больше нет в работе`);
    html = taskView(s);
  } else if (r.kind === "ask") {
    const g = last.general_asks.find(x => x.id === r.id);
    if (!g) return leave("Этот вопрос уже снят");
    html = generalView(g);
  } else {
    html = homeView();
  }
  document.getElementById("app").innerHTML = html;
  setTimeout(loadIssues, 0);
  stampUpdated();
}

function stampUpdated() {
  const el = document.getElementById("sub");
  if (el && updatedAt) el.textContent = "обновлено " + updatedAt.toLocaleTimeString("ru-RU");
}

function safeRender() {
  try {
    render();
  } catch (e) {
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="error">ошибка отрисовки: ${esc(e.message)}</div>`);
  }
}

let pointerDown = false, dialogOpen = false, uiVersion = null;

function dialog({title, body = "", ok = "OK", cancel = "Отмена", danger = false}) {
  return new Promise(resolve => {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>${body ? `<div class="modal-body">${body}</div>` : ""}
        <div class="modal-actions">${cancel ? `<button type="button" data-m="0">${esc(cancel)}</button>` : ""}
          <button type="button" class="primary ${danger ? "danger" : ""}" data-m="1">${esc(ok)}</button></div></div></div>`;
    dialogOpen = true;
    const done = v => { dialogOpen = false; root.innerHTML = ""; document.removeEventListener("keydown", key, true); resolve(v); flushRender(); };
    const key = e => {
      if (e.key === "Escape") { e.preventDefault(); done(false); }
      if (e.key === "Enter" && !e.target.matches("[data-m='0']")) { e.preventDefault(); done(true); }
    };
    document.addEventListener("keydown", key, true);
    root.querySelector(".modal-overlay").addEventListener("click", e => {
      const b = e.target.closest("[data-m]");
      if (b) done(b.dataset.m === "1");
      else if (e.target.classList.contains("modal-overlay")) done(false);
    });
    root.querySelector("[data-m='1']").focus();
  });
}
// A re-render between mousedown and mouseup swaps the button under the cursor and eats the click.
const editing = () => pointerDown || dialogOpen || document.activeElement?.tagName === "TEXTAREA";

function flushRender() {
  if (pendingRender && !editing()) { pendingRender = false; safeRender(); }
}

document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => { pointerDown = false; setTimeout(flushRender, 100); }, true);
document.addEventListener("pointercancel", () => { pointerDown = false; }, true);

async function refresh() {
  if (loading) return;
  loading = true;
  try {
    const res = await fetch("/api/state", {cache: "no-store"});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    updatedAt = new Date();
    // The page was updated on disk: reload once nothing is being typed; drafts survive in sessionStorage.
    if (uiVersion === null) uiVersion = data.ui_version;
    else if (data.ui_version && data.ui_version !== uiVersion && !editing()) { saveDrafts(); location.reload(); return; }
    const key = JSON.stringify(data);
    last = data;
    // Re-render only on a real change, so open blocks and scroll stay put.
    if (key !== lastKey) {
      lastKey = key;
      if (editing()) pendingRender = true; else safeRender();
    } else {
      stampUpdated();
    }
  } catch (e) {
    const el = document.getElementById("sub");
    if (el) el.innerHTML = `<span class="error">нет связи с сервером: ${esc(e.message)}</span>`;
  } finally {
    loading = false;
  }
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  return {res, data};
}

document.addEventListener("toggle", e => {
  const k = e.target.dataset?.key;
  if (!k) return;
  e.target.open ? openDetails.add(k) : openDetails.delete(k);
}, true);
function saveDrafts() {
  try { sessionStorage.setItem("desk-drafts", JSON.stringify([...drafts])); } catch (e) { /* storage may be unavailable */ }
}
try { JSON.parse(sessionStorage.getItem("desk-drafts") || "[]").forEach(([k, v]) => drafts.set(k, v)); } catch (e) { /* ignore */ }

document.addEventListener("input", e => {
  const f = e.target.closest("form.reply, form.term-text");
  if (f) { drafts.set(f.dataset.key, e.target.value); saveDrafts(); }
});
document.addEventListener("focusout", () => setTimeout(() => {
  flushRender();
}, 0));
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); safeRender(); });

document.addEventListener("click", async e => {
  if (e.target.closest("a")) return;
  const q = e.target.closest("[data-quick]");
  if (q) { sendReply(q.closest("form.reply"), q.dataset.quick); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const {stream, label} = pick.dataset;
    if (!await dialog({title: `Ответ в терминал · ${stream}`, body: `<div class="quote">${esc(label)}</div>`, ok: "Выбрать"})) return;
    const {res, data} = await post("/api/terminal", {stream, key: pick.dataset.pick});
    if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
    else toast(`Выбрано: ${data.picked}`);
    lastKey = ""; await refresh();
    return;
  }
  if (e.target.closest("#toggle-closed")) { showClosed = !showClosed; safeRender(); return; }
  const ws = e.target.closest("[data-ws]");
  if (ws) {
    const stream = ws.dataset.stream, action = ws.dataset.ws;
    if (action === "up" && !await dialog({title: `Запустить стенд ${stream}?`, body: `<p class="muted">Выполнится <code>task app:up</code> в worktree задачи. Вывод появится в блоке «Стенд».</p>`, ok: "Запустить"})) return;
    busy.set(stream, action); safeRender();
    const {res, data} = await post(`/api/workspace/${action}`, {stream});
    busy.delete(stream);
    if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
    lastKey = ""; await refresh();
    return;
  }
  const row = e.target.closest("[data-href]");
  if (row) location.hash = row.dataset.href;
});

document.addEventListener("paste", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  const files = e.clipboardData && e.clipboardData.files;
  if (!f || !files || !files.length) return;
  e.preventDefault();
  addImages(f, files);
});
document.addEventListener("dragover", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (f) { e.preventDefault(); f.classList.add("drop"); }
});
document.addEventListener("dragleave", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (f && !f.contains(e.relatedTarget)) f.classList.remove("drop");
});
document.addEventListener("drop", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (!f) return;
  e.preventDefault(); f.classList.remove("drop");
  addImages(f, e.dataTransfer.files);
});
document.addEventListener("change", e => {
  if (!e.target.matches("[data-attach]")) return;
  addImages(e.target.closest("form.reply"), e.target.files);
  e.target.value = "";
});
document.addEventListener("click", e => {
  const x = e.target.closest("[data-unattach]");
  if (!x) return;
  const f = x.closest("form.reply"), list = attachments.get(f.dataset.key) || [];
  const [gone] = list.splice(Number(x.dataset.unattach), 1);
  if (gone) URL.revokeObjectURL(gone.url);
  redrawThumbs(f);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (!e.target.matches("form.term-text")) return sendReply(e.target, null);
  const f = e.target, text = f.querySelector("textarea").value.trim(), stream = f.dataset.stream;
  if (!text) return;
  if (!await dialog({title: `Свой ответ в терминал · ${stream}`, body: `<div class="quote">${esc(text)}</div>`, ok: "Отправить"})) return;
  const {res, data} = await post("/api/terminal", {stream, text});
  if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
  else { toast("Ответ ушёл в терминал"); drafts.delete(f.dataset.key); saveDrafts(); }
  lastKey = ""; await refresh();
});

// quick: a canned reply sent on its own (still confirmed); null sends the typed text and images.
async function sendReply(f, quick) {
  const ta = f.querySelector("textarea"), rc = f.querySelector(".receipt"), btn = f.querySelector("button[type=submit]");
  const note = (cls, text) => { rc.className = "receipt " + cls; rc.textContent = text; receipts.set(f.dataset.key, {cls, text}); };
  const text = quick ?? ta.value.trim();
  const list = quick ? [] : attachments.get(f.dataset.key) || [];
  if (list.some(a => !a.path && !a.error)) { note("err", "Картинка ещё загружается."); return; }
  if (list.some(a => a.error)) { note("err", "Убери картинки с ошибкой."); return; }
  const images = list.map(a => a.path);
  const asks = JSON.parse(f.dataset.asks || "[]");
  if (!text && !images.length) { note("err", "Пустой ответ."); return; }
  const preview = (asks.length ? `<p class="muted">На вопрос: ${asks.map(a => `«${inline(a)}»`).join("; ")}</p>` : "") + (text ? `<div class="quote">${esc(text).replace(/\n/g, "<br>")}</div>` : "") +
    (list.length ? `<div class="thumbs">${list.map(a => `<span class="thumb"><img src="${esc(a.url)}" alt=""></span>`).join("")}</div>` : "");
  const kind = f.dataset.kind || "reply";
  const title = kind === "note" ? `Комментарий · ${f.dataset.stream}` : `Ответ оркестратору${f.dataset.stream ? " · " + f.dataset.stream : ""}`;
  if (!await dialog({title, body: preview, ok: "Отправить"})) return;
  btn.disabled = true; note("", "Отправляю…");
  try {
    const {res, data: r} = await post("/api/reply", {session_id: f.dataset.session, stream: f.dataset.stream, text, images, asks, kind});
    if (res.ok && r.ok) {
      note("", "Доставлено оркестратору · " + new Date().toLocaleTimeString("ru-RU"));
      if (!quick) {
        drafts.delete(f.dataset.key); saveDrafts(); ta.value = "";
        list.forEach(a => URL.revokeObjectURL(a.url)); attachments.delete(f.dataset.key); redrawThumbs(f);
      }
    } else {
      note("err", "Не доставлено: " + (r.error || JSON.stringify(r.receipt || r)));
    }
  } catch (err) {
    note("err", "Ошибка: " + err.message);
  } finally {
    btn.disabled = false;
    // A render may have replaced this form while the request ran; redraw from the saved state.
    if (!f.isConnected && !editing()) safeRender();
  }
}

function anyPending() {
  if (!last) return false;
  return last.streams.some(s => (streamReply(s) || {}).kind === "pending")
    || last.general_asks.some(g => (replyState("", g.orchestrator, true, g.item) || {}).kind === "pending");
}

// Poll fast while a reply is on its way, so the unblock is seen as it happens.
(async function loop() {
  await refresh();
  setTimeout(loop, anyPending() ? 1500 : 5000);
})();
</script>
