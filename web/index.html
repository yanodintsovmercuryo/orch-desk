function icon(name, cls = "") {
  return `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

function splitTitle(t) {
  // "[console][admin] Tables: …" → tags ["console", "admin"], title "Tables: …"
  const tags = [];
  let rest = String(t || "");
  let m;
  while ((m = rest.match(/^\s*\[([^\]]+)\]\s*/))) { tags.push(m[1]); rest = rest.slice(m[0].length); }
  return {tags, title: rest};
}

function repoOf(s) {
  const path = s.header.repository || "";
  const m = path.match(/\/workspaces\/([^/]+)\//) || path.match(/\/([^/]+)\/?$/);
  if (m) return m[1];
  const pr = (s.links.pr || {}).url || "";
  return (pr.match(/github\.com\/[^/]+\/([^/]+)\//) || [])[1] || "";
}

function titleHtml(s) {
  const repo = repoOf(s);
  return `${repo ? `<span class="repo">${esc(repo)}</span>` : ""}<span class="t-title">${esc(splitTitle(titleOf(s)).title)}</span>`;
}

function short(ts) {
  if (!ts) return "—";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "сейчас";
  if (m < 60) return `${m} мин`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} ч` : `${Math.round(h / 24)} дн`;
}

function iconLinks(s) {
  const lin = s.links.linear || {}, pr = s.links.pr || {}, w = s.workspace || {};
  const web = (w.info || {}).web || {}, app = ((w.info || {}).status || {}).application;
  const a = (url, title, html, cls = "") => `<a class="ilink ${cls}" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(title)}">${html}</a>`;
  const out = [];
  out.push(pr.url ? a(pr.url, `PR #${pr.number} · ${(pr.state || "").toLowerCase()}`, `${icon("pr")}<span>${esc(pr.number)}</span>`)
    : `<span class="ilink off" title="PR ещё нет">${icon("pr")}<span>—</span></span>`);
  if (lin.url) out.push(a(lin.url, `Linear · ${lin.state || ""}`, icon("linear")));
  if (web.console) out.push(a(web.console, `Стенд · ${APP[app] || app || ""}`, `${icon("server")}<i class="sdot ${app === "running" ? "on" : ""}"></i>`));
  return `<span class="ilinks">${out.join("")}</span>`;
}

function tsMs(ts) {
  if (!ts) return 0;
  const v = Date.parse(String(ts).replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
  return isNaN(v) ? 0 : v;
}

function orchOf(name) {
  return last.orchestrators.find(o => o.name === name) || {};
}

// What happened to the owner's latest reply on a stream: pending, again (a turn ended and the
// ask is still there), resolved (the ask left the waiting line), or nothing to show.
const stemsOf = t => new Set((String(t || "").match(/[\p{L}\p{N}_-]{4,}/gu) || []).filter(w => !/^\d+$/.test(w)).map(w => w.toLowerCase().slice(0, 6)));

function similar(a, b) {
  const sa = stemsOf(a), sb = stemsOf(b);
  if (!sa.size || !sb.size) return false;
  let n = 0;
  sa.forEach(w => { if (sb.has(w)) n++; });
  return n / Math.min(sa.size, sb.size) >= 0.5;
}

// item: for a general ask, only a reply naming that same question counts.
function replyState(streamId, orchName, asked, item) {
  const r = [...(last.replies || [])].reverse().find(x => x.ok && x.stream === streamId && (!x.kind || x.kind === "reply")
    && (!item || (x.asks || []).some(a => similar(a, item)) || (!x.asks && similar(x.text, item))));
  if (!r) return null;
  const sent = tsMs(r.ts), o = orchOf(orchName), turn = tsMs(o.message_ts);
  const busy = o.session_status === "busy";
  if (asked) {
    // A busy orchestrator may still be reading the reply; judge only a turn that has ended.
    if (turn > sent + 3000 && !busy) return {kind: "again", r};
    return {kind: "pending", r, reading: busy};
  }
  if (turn > sent && Date.now() - sent < 10 * 60000) return {kind: "resolved", r, at: turn};
  return null;
}

const streamReply = s => replyState(s.id, s.orchestrator, s.owner_asks.length > 0);

function tracker(rs) {
  if (!rs) return "";
  const steps = [
    ["Отправлено", "done", when(rs.r.ts)],
    ["Оркестратор читает", rs.kind === "pending" ? (rs.reading ? "now" : "wait") : "done", rs.kind === "pending" && !rs.reading ? "в очереди" : ""],
    [rs.kind === "again" ? "Снова нужен ответ" : "Вопрос снят", rs.kind === "resolved" ? "done" : rs.kind === "again" ? "alert" : "", rs.kind === "resolved" ? when(rs.at) : ""],
  ];
  return `<ol class="tracker">${steps.map(([t, st, sub]) => `<li class="${st}"><i></i><span>${esc(t)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</li>`).join("")}</ol>`;
}

const LIVE_ASK = a => ["open", "answered", "consumed"].includes(a.status);

// Desk asks are the source of truth; a waiting-line ask is kept only while no desk record covers it.
function prepare(d) {
  const asksList = d.desk_asks || [];
  const openIds = new Set(d.streams.filter(s => !s.closed).map(s => s.id));
  d.streams.forEach(s => {
    s.deskAsks = asksList.filter(a => a.task === s.id);
    if (s.deskAsks.some(LIVE_ASK)) { s.owner_asks = []; s.ask = {}; }
  });
  d.deskGeneral = asksList.filter(a => !a.task || !openIds.has(a.task));
  // A waiting item that only names desk asks is already on the page as those asks.
  const known = new Set(asksList.map(a => a.id));
  d.general_asks = (d.general_asks || []).filter(g => {
    const refs = g.item.match(/\bask-\d+\b/g) || [];
    if (refs.length && refs.every(r => known.has(r))) return false;
    return !asksList.some(a => LIVE_ASK(a) && ((a.task && g.item.includes(a.task)) || similar(a.question, g.item)));
  });
}

function deskState(list) {
  if (list.some(a => a.status === "open")) return "open";
  if (list.some(a => a.status === "answered" || a.status === "consumed")) return "pending";
  if (list.some(a => a.status === "done" || a.status === "withdrawn")) return "resolved";
  return "";
}

function statusIcon(s) {
  const one = (name, title, cls = "") => `<span class="sicon ${cls}" title="${title}">${icon(name)}</span>`;
  const ds = deskState(s.deskAsks || []);
  if (ds === "open") return one("ask", "ждёт тебя", "you");
  if (ds === "pending") return one("send", "ответ у оркестратора", "pending");
  const rs = streamReply(s);
  if (rs && rs.kind === "pending") return one("send", rs.reading ? "оркестратор читает ответ" : "ответ отправлен", "pending");
  if (ds === "resolved") return one("check", "вопрос закрыт", "resolved");
  if (rs && rs.kind === "resolved") return one("check", "вопрос снят", "resolved");
  if (s.closed) return one("check", "закрыта", "muted");
  if (s.prompt && !s.prompt.error) return one("terminal", "ждёт ввода в терминале", "you");
  if (s.owner_asks.length) return one("ask", "ждёт тебя", "you");
  if (s.prepared) return one("hourglass", "готовится к запуску", "muted");
  if (s.derived["owed by"] === "the orchestrator") return one("hourglass", "у оркестратора");
  return one("activity", "в работе", "muted");
}

function statusCell(s) {
  if (s.closed) return `<span class="st muted">${icon("check")}закрыта</span>`;
  if (s.prepared && !s.owner_asks.length) return `<span class="st muted">${icon("hourglass")}готовится к запуску</span>`;
  if (s.prompt && !s.prompt.error) return `<span class="badge you">${icon("terminal")}Ждёт ввода</span>`;
  const ds = deskState(s.deskAsks || []);
  if (ds === "open") return `<span class="badge you">${icon("ask")}Ждёт тебя</span>`;
  if (ds === "pending") return `<span class="st">${icon("send")}ответ у оркестратора</span>`;
  if (s.owner_asks.length) return `<span class="badge you">${icon("ask")}Ждёт тебя</span>`;
  if (s.derived["owed by"] === "the orchestrator") return `<span class="st">${icon("hourglass")}у оркестратора</span>`;
  return `<span class="st muted">${icon("activity")}в работе</span>`;
}

function stageCell(s) {
  if (s.prepared) return `<div class="stage"><span class="stage-label">готовится к запуску</span></div>`;
  const idx = s.progress.index;
  const bars = last.checkpoints.map((c, i) =>
    `<i class="${i < idx || (i === idx && s.closed) ? "done" : i === idx ? "now" : ""}" title="${esc(STAGES[c] || c)}"></i>`).join("");
  return `<div class="stage"><div class="bar">${bars}</div><span class="stage-label">${esc(idx >= 0 ? STAGES[last.checkpoints[idx]] : "—")}</span></div>`;
}

function inFlight(status) {
  const seg = String(status || "").split(" · ").find(x => x.trim().startsWith("in flight:"));
  return seg ? seg.replace(/^\s*in flight:\s*/, "") : "";
}

function dropId(text, id) {
  // The row already names the task; "(MER-1)" inside its own ask is noise.
  return String(text).replace(new RegExp(`\\s*\\(${id}\\)`, "g"), "").trim();
}

const EVENT_KIND = {nudge: "сигнал оркестратору", notify: "уведомление тебе", error: "ошибка"};

function supervisorPanel(sv) {
  if (!sv) return "";
  const c = sv.config;
  const toggle = (key, label) => `<button type="button" class="${c[key] ? "on" : ""}" data-sv="${key}">${label}</button>`;
  const rows = (sv.events || []).map(e => `<li class="${e.kind === "error" || e.sent === false ? "note" : ""}"><span>${esc(when(e.ts))}</span>
      <div><span class="muted">${esc(EVENT_KIND[e.kind] || e.kind)}${e.sent === false ? " · не доставлен" : ""}</span> · ${inline(e.text)}</div></li>`).join("");
  return `<section class="panel"><div class="panel-body">${det("supervisor", `${icon("activity")} надсмотрщик · ${(sv.events || []).length ? esc(short((sv.events[0] || {}).ts)) + " назад последнее событие" : "событий пока нет"}`,
    `<div class="row-actions" style="margin-bottom:12px"><span class="seg">${toggle("nudge", "сигналы оркестратору")}${toggle("notify", "уведомления мне")}</span>
      <span class="muted small">стримов в работе держать:</span>
      <span class="seg">${[2, 3, 4, 5, 6].map(n => `<button type="button" class="${c.wip === n ? "on" : ""}" data-sv-wip="${n}">${n}</button>`).join("")}</span></div>
     ${rows ? `<ul class="log">${rows}</ul>` : `<span class="muted small">Пока тихо.</span>`}`)}</div></section>`;
}

function homeView() {
  const d = last;
  const openS = d.streams.filter(s => !s.closed), closedS = d.streams.filter(s => s.closed);
  const nAsks = openS.filter(s => s.owner_asks.length || (s.prompt && !s.prompt.error) || (s.deskAsks || []).some(a => a.status === "open")).length
    + d.general_asks.length + (d.deskGeneral || []).filter(a => a.status === "open").length;
  const shown = showClosed ? openS.concat(closedS) : openS;
  const row = s => {
    const rs = streamReply(s);
    const pq = s.prompt && !s.prompt.error ? (s.prompt.question[1] || s.prompt.question[0] || "вопрос в терминале") : "";
    const da = (s.deskAsks || []).filter(LIVE_ASK);
    const deskLine = da.length ? `<div class="row-ask ${da.some(a => a.status === "open") ? "" : "live"}">${da.map(a => a.status === "open"
      ? inline(a.question) : `${icon("send")}${a.status === "consumed" ? "оркестратор прочитал ответ" : "ответ отправлен"} · ${inline(a.question)}`).join(" · ")}</div>` : "";
    const line = deskLine ? deskLine : pq ? `<div class="row-ask live">${icon("terminal")}ждёт ввода в терминале: ${esc(pq)}</div>`
      : rs && rs.kind === "pending" ? `<div class="row-ask live">${icon("send")}ответ отправлен · ${rs.reading ? "оркестратор читает…" : "ждёт оркестратора…"}</div>`
      : rs && rs.kind === "resolved" ? `<div class="row-ask ok">${icon("check")}вопрос снят</div>`
      : s.owner_asks.length ? `<div class="row-ask">${rs && rs.kind === "again" ? "снова нужен ответ · " : ""}${s.owner_asks.map(a => inline(dropId(a, s.id))).join(" · ")}</div>` : "";
    // Flash a resolved row once, not on every later re-render.
    const flashKey = rs && rs.kind === "resolved" ? s.id + rs.r.ts : "";
    const flash = flashKey && !flashed.has(flashKey);
    if (flash) flashed.add(flashKey);
    return `<tr class="row ${flash ? "flash" : ""}" data-href="#/task/${esc(encodeURIComponent(s.id))}">
      <td class="col-task"><div class="t-line"><span class="id">${esc(s.id)}</span>${titleHtml(s)}</div>${line}</td>
      <td class="col-stage">${stageCell(s)}</td><td class="col-status">${statusIcon(s)}</td>
      <td class="col-links">${iconLinks(s)}</td>
      <td class="col-when" title="${esc(when(s.last_ts))}">${esc(short(s.last_ts))}</td></tr>`;
  };
  const deskRows = (d.deskGeneral || []).filter(LIVE_ASK).map(a => `<tr class="row" data-href="#/ask/${esc(a.id)}">
      <td class="col-task"><div class="t-line"><span class="id">${esc(a.task || a.id)}</span><span class="t-title">${inline(a.question)}</span></div>
        ${a.status !== "open" ? `<div class="row-ask live">${icon("send")}${a.status === "consumed" ? "оркестратор прочитал ответ" : "ответ отправлен"}</div>` : ""}</td>
      <td class="col-stage"></td><td class="col-status">${a.status === "open" ? `<span class="sicon you" title="ждёт тебя">${icon("ask")}</span>` : `<span class="sicon pending" title="ответ у оркестратора">${icon("send")}</span>`}</td>
      <td class="col-links"></td><td class="col-when">${esc(short(a.created))}</td></tr>`).join("");
  const general = deskRows + d.general_asks.map(g => `<tr class="row" data-href="#/ask/${esc(encodeURIComponent(g.id))}">
      <td class="col-task"><div class="t-line"><span class="id">${esc((g.item.match(/MER-\d+/) || ["вопрос"])[0])}</span><span class="t-title">${inline(g.item)}</span></div></td>
      <td class="col-stage"></td><td class="col-status"><span class="sicon you" title="ждёт тебя">${icon("ask")}</span></td>
      <td class="col-links"></td><td class="col-when">${esc(short((g.ask && g.ask.origin || {}).ts))}</td></tr>`).join("");
  const needsYou = s => s.owner_asks.length || (s.prompt && !s.prompt.error) || (s.deskAsks || []).some(a => a.status === "open");
  const waitingRows = shown.filter(needsYou).map(row).join("");
  const rows = shown.filter(s => !needsYou(s)).map(row).join("");
  const orch = d.orchestrators.map(o => {
    const flight = inFlight(o.status_line);
    return `<div class="orch">${icon("bot")}<div class="orch-main"><div><b>${esc(o.name.split("/").pop())}</b>
        <span class="muted">· ${esc(short(o.message_ts))}</span></div>
        ${o.error ? `<div class="error">${esc(o.error)}</div>` : `<div class="orch-flight">${flight ? inline(flight) : "ничего не запущено"}</div>`}
        ${det("orch:" + o.name, "последнее сообщение", `<div class="quote">${md(o.message)}</div>`)}</div></div>`;
  }).join("");
  const replies = [...(d.replies || [])].reverse().map(r =>
    `<li class="${r.ok ? "" : "note"}"><span>${esc(when(r.ts))}</span><div>${r.ok ? "" : "не доставлено: "}${esc(r.text.replace(/^\[desk\]\s*/, ""))}${r.error ? " — " + esc(r.error) : ""}</div></li>`).join("");
  return `<div class="page-head"><div><h1>Задачи</h1><div class="sub" id="sub"></div></div>
      <div class="stats"><span class="stat" title="ждут тебя">${icon("ask")}<b>${nAsks}</b></span><span class="stat" title="в работе">${icon("activity")}<b>${openS.length}</b></span>
        <button class="stat toggle-stat" id="toggle-closed" type="button" title="${showClosed ? "Скрыть закрытые" : "Показать закрытые"}">${icon("check")}<b>${closedS.length}</b></button></div></div>
    <section class="panel"><table class="tasks"><tbody>${waitingRows + general + rows || `<tr><td class="empty">Нет задач.</td></tr>`}</tbody></table></section>
    <section class="panel">${orch}</section>
    ${supervisorPanel(d.supervisor)}
    ${replies ? `<section class="panel"><div class="panel-body">${det("replies", `${icon("send")} отправленные ответы · ${d.replies.length}`, `<ul class="log">${replies}</ul>`)}</div></section>` : ""}`;
}

// A stale link: go to the task list and say why, instead of an empty page.
function leave(message) {
  history.replaceState(null, "", location.pathname + location.search + "#/");
  toast(message);
  render();
}

let toastTimer = 0;
function toast(message) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${icon("check")}<span>${esc(message)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const t = root.querySelector(".toast");
    if (t) { t.classList.add("out"); setTimeout(() => { root.innerHTML = ""; }, 250); }
  }, 4000);
}

let viewer = null, code = null, viewerPan = null, panDrag = null;

window.addEventListener("mousemove", e => {
  if (!panDrag || !viewerPan) return;
  viewerPan.move(e.clientX - panDrag.x, e.clientY - panDrag.y);
  panDrag = {x: e.clientX, y: e.clientY};
});
window.addEventListener("mouseup", () => {
  panDrag = null;
  if (viewerPan) viewerPan.body.classList.remove("panning");
});

async function openSource(path, line, end) {
  const res = await fetch(`/api/source?path=${encodeURIComponent(path)}&line=${encodeURIComponent(line || 0)}`, {cache: "no-store"});
  const data = await res.json();
  if (!res.ok) return toast(data.error || "Файл не открылся");
  code = {...data, end: Number(end) || data.line, doc: /\.md$/i.test(data.path) && !data.line};
  drawCode();
}

function drawCode() {
  const root = document.getElementById("viewer-root");
  if (!code) { root.innerHTML = ""; dialogOpen = false; return; }
  dialogOpen = true;
  const name = code.path.split("/").pop(), from = code.line, to = Math.max(code.end || from, from);
  const rows = code.lines.map((l, i) => {
    const n = i + 1, hl = from && n >= from && n <= to;
    return `<div class="ln ${hl ? "hl" : ""}" ${n === from ? 'id="code-focus"' : ""}><span class="no">${n}</span><span class="tx">${esc(l) || " "}</span></div>`;
  }).join("");
  const isMd = /\.md$/i.test(code.path);
  root.innerHTML = `<div class="viewer" role="dialog" aria-modal="true">
    <div class="viewer-bar"><b>${esc(name)}${from ? `:${from}${to > from ? "-" + to : ""}` : ""}</b>
      <span class="muted path">${esc(code.path.replace(/^\/Users\/[^/]+/, "~"))}</span>
      <span class="right">${isMd ? `<button type="button" data-c="doc">${code.doc ? "исходник" : "документ"}</button>` : ""}
        <button type="button" class="primary" data-c="zed">Открыть в Zed</button>
        <button type="button" data-c="close" title="Закрыть (Esc)">×</button></span></div>
    <div class="code-body">${code.doc ? `<div class="quote doc">${md(code.lines.join("\n"))}</div>` : `<pre class="code">${rows}</pre>`}</div></div>`;
  const focus = root.querySelector("#code-focus");
  if (focus) focus.scrollIntoView({block: "center"});
}

document.addEventListener("click", async e => {
  const link = e.target.closest("[data-src]");
  if (link) { e.preventDefault(); e.stopPropagation(); openSource(link.dataset.src, link.dataset.line, link.dataset.end); return; }
  const c = e.target.closest("[data-c]");
  if (!c || !code) return;
  e.stopPropagation();
  const act = c.dataset.c;
  if (act === "close") { code = null; drawCode(); flushRender(); }
  else if (act === "doc") { code.doc = !code.doc; drawCode(); }
  else if (act === "zed") {
    const {res, data} = await post("/api/zed", {path: code.path, line: code.line || 0});
    if (!res.ok) toast(data.error || "Zed не открылся"); else toast("Открыто в Zed");
  }
}, true);

document.addEventListener("keydown", e => {
  if (code && e.key === "Escape") { e.preventDefault(); e.stopPropagation(); code = null; drawCode(); flushRender(); }
}, true);

async function openShots(path) {
  const res = await fetch("/api/shots?path=" + encodeURIComponent(path), {cache: "no-store"});
  const data = await res.json();
  if (!res.ok) return toast(data.error || "Не открылось");
  if (!data.items.length) return toast("В папке нет картинок");
  viewer = {...data, i: data.start || 0};
  drawViewer();
}

function drawViewer() {
  const root = document.getElementById("viewer-root");
  if (!viewer) { root.innerHTML = ""; dialogOpen = false; return; }
  dialogOpen = true;
  const it = viewer.items[viewer.i], n = viewer.items.length;
  const pane = (label, path) => `<figure><figcaption>${label}</figcaption>
    <div class="shot-scroll"><img src="/api/file?path=${encodeURIComponent(path)}" alt="${esc(label)}" data-zoom-img></div></figure>`;
  const body = it.before && it.after ? pane("было", it.before) + pane("стало", it.after)
    : pane(it.before ? "было" : "стало", it.after || it.before);
  root.innerHTML = `<div class="viewer" role="dialog" aria-modal="true">
    <div class="viewer-bar"><b>${esc(it.name)}</b><span class="muted">${viewer.i + 1} / ${n} · ${esc(viewer.folder.replace(/^\/Users\/[^/]+/, "~"))}</span>
      <span class="right">
        <span class="zoom"><button type="button" data-v="out" title="Уменьшить (−)">−</button>
          <button type="button" data-v="fit" title="По ширине (0)">${viewer.scale ? Math.round(viewer.scale * 100) + "%" : "по ширине"}</button>
          <button type="button" data-v="in" title="Увеличить (+)">+</button></span>
        <button type="button" data-v="reveal">${icon("folder")}Показать в Finder</button>
        <button type="button" data-v="close" title="Закрыть (Esc)">×</button></span></div>
    <div class="viewer-body ${it.before && it.after ? "pair" : ""}">${body}</div>
    <button type="button" class="viewer-nav prev" data-v="prev" ${n < 2 ? "hidden" : ""}>‹</button>
    <button type="button" class="viewer-nav next" data-v="next" ${n < 2 ? "hidden" : ""}>›</button></div>`;
  const imgs = [...root.querySelectorAll("[data-zoom-img]")];
  imgs.forEach(img => img.complete ? applyZoom() : img.addEventListener("load", applyZoom, {once: true}));
  syncScroll([...root.querySelectorAll(".shot-scroll")]);
}

// null scale fits the column width; a number is a multiple of the image's own pixel width.
function applyZoom() {
  document.querySelectorAll("#viewer-root [data-zoom-img]").forEach(img => {
    img.style.width = viewer && viewer.scale ? `${Math.round(img.naturalWidth * viewer.scale)}px` : "100%";
    img.style.maxWidth = viewer && viewer.scale ? "none" : "100%";
  });
}

function zoomBy(f) {
  const img = document.querySelector("#viewer-root [data-zoom-img]");
  if (!img || !img.naturalWidth) return;
  const now = viewer.scale || img.clientWidth / img.naturalWidth;
  viewer.scale = Math.min(4, Math.max(0.1, now * f));
  drawViewer();
}

// One shared scroll point in pixels: each pane shows min(point, its own edge), so a shorter shot
// parks at its end while the longer one goes on, and moves again only once the point is back inside it.
function syncScroll(panes) {
  if (!panes.length || !viewer) return;
  const body = panes[0].closest(".viewer-body");
  const pos = viewer.pos || (viewer.pos = {x: 0, y: 0});
  const edge = (p, axis) => axis === "y" ? p.scrollHeight - p.clientHeight : p.scrollWidth - p.clientWidth;
  const clampTo = (v, max) => Math.max(0, Math.min(v, max));
  const apply = () => panes.forEach(p => {
    p.scrollTop = clampTo(pos.y, edge(p, "y"));
    p.scrollLeft = clampTo(pos.x, edge(p, "x"));
  });
  const far = axis => Math.max(0, ...panes.map(p => edge(p, axis)));
  body.addEventListener("wheel", e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? panes[0].clientHeight : 1;
    const dx = (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * unit;
    const dy = (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * unit;
    pos.y = clampTo(pos.y + dy, far("y"));
    pos.x = clampTo(pos.x + dx, far("x"));
    apply();
  }, {passive: false});
  panes.forEach(p => p.addEventListener("scroll", () => {
    // Our own writes land exactly on the clamped point; anything else is a scrollbar drag.
    const ours = Math.abs(p.scrollTop - clampTo(pos.y, edge(p, "y"))) < 1 && Math.abs(p.scrollLeft - clampTo(pos.x, edge(p, "x"))) < 1;
    if (ours) return;
    pos.y = p.scrollTop;
    pos.x = p.scrollLeft;
    apply();
  }));
  panes.forEach(p => p.querySelector("img")?.addEventListener("load", apply));
  // Right or middle button held down drags the shots; left click keeps toggling the zoom.
  viewerPan = {body, move: (dx, dy) => {
    pos.x = clampTo(pos.x - dx, far("x"));
    pos.y = clampTo(pos.y - dy, far("y"));
    apply();
  }};
  body.addEventListener("mousedown", e => {
    if (e.button !== 1 && e.button !== 2) return;
    e.preventDefault();
    panDrag = {x: e.clientX, y: e.clientY};
    body.classList.add("panning");
  });
  body.addEventListener("contextmenu", e => e.preventDefault());
  body.addEventListener("auxclick", e => e.preventDefault());
  apply();
}

function stepViewer(d) {
  if (!viewer) return;
  viewer.i = (viewer.i + d + viewer.items.length) % viewer.items.length;
  viewer.pos = {x: 0, y: 0};
  drawViewer();
}

document.addEventListener("keydown", e => {
  if (!viewer) return;
  if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomBy(1.25); }
  else if (e.key === "-") { e.preventDefault(); zoomBy(0.8); }
  else if (e.key === "0") { e.preventDefault(); viewer.scale = null; drawViewer(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stepViewer(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); stepViewer(1); }
  else if (e.key === "Escape") { e.preventDefault(); viewer = null; drawViewer(); flushRender(); }
}, true);

document.addEventListener("click", async e => {
  const link = e.target.closest("[data-shots]");
  if (link) { e.preventDefault(); e.stopPropagation(); openShots(link.dataset.shots); return; }
  const zimg = e.target.closest("[data-zoom-img]");
  if (zimg && viewer) { viewer.scale = viewer.scale ? null : 1; drawViewer(); return; }
  const v = e.target.closest("[data-v]");
  if (!v && e.target.classList && e.target.classList.contains("viewer")) { viewer = null; drawViewer(); flushRender(); return; }
  if (!v) return;
  const act = v.dataset.v;
  if (act === "in") zoomBy(1.25);
  else if (act === "out") zoomBy(0.8);
  else if (act === "fit") { viewer.scale = null; drawViewer(); }
  else if (act === "prev") stepViewer(-1);
  else if (act === "next") stepViewer(1);
  else if (act === "close") { viewer = null; drawViewer(); flushRender(); }
  else if (act === "reveal") {
    const it = viewer.items[viewer.i];
    const {res, data} = await post("/api/reveal", {path: it.after || it.before});
    if (!res.ok) toast(data.error || "Не открылось в Finder");
  }
}, true);

function render() {
  if (!last) return;
  const r = route();
  let html;
  ctxRepo = "";
  if (r.kind === "task") {
    const s = last.streams.find(x => x.id === r.id);
    if (s) ctxRepo = repoOf(s);
    if (!s) return leave(`Задачи ${r.id} больше нет в работе`);
    html = taskView(s);
  } else if (r.kind === "ask" && /^ask-\d+$/.test(r.id)) {
    const a = (last.desk_asks || []).find(x => x.id === r.id);
    if (!a) return leave("Этот вопрос уже закрыт");
    html = deskAskView(a);
  } else if (r.kind === "ask") {
    const g = last.general_asks.find(x => x.id === r.id);
    if (!g) return leave("Этот вопрос уже снят");
    html = generalView(g);
  } else {
    html = homeView();
  }
  document.getElementById("app").innerHTML = html;
  setTimeout(loadIssues, 0);
  if (r.kind === "task" && !advisorState.has(r.id)) loadAdvisor(r.id);
  stampUpdated();
}

function stampUpdated() {
  const el = document.getElementById("sub");
  if (el && updatedAt) el.textContent = "обновлено " + updatedAt.toLocaleTimeString("ru-RU", {hourCycle: "h23"});
}

function safeRender() {
  try {
    render();
  } catch (e) {
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="error">ошибка отрисовки: ${esc(e.message)}</div>`);
  }
}

let pointerDown = false, dialogOpen = false, uiVersion = null, dialogNote = "";

function dialog({title, body = "", ok = "OK", cancel = "Отмена", danger = false}) {
  return new Promise(resolve => {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>${body ? `<div class="modal-body">${body}</div>` : ""}
        <div class="modal-actions">${cancel ? `<button type="button" data-m="0">${esc(cancel)}</button>` : ""}
          <button type="button" class="primary ${danger ? "danger" : ""}" data-m="1">${esc(ok)}</button></div></div></div>`;
    dialogOpen = true;
    const done = v => { dialogNote = (root.querySelector("#dlg-note") || {}).value || ""; dialogOpen = false; root.innerHTML = ""; document.removeEventListener("keydown", key, true); resolve(v); flushRender(); };
    const key = e => {
      if (e.key === "Escape") { e.preventDefault(); done(false); }
      if (e.key === "Enter" && !e.target.matches("[data-m='0']")) { e.preventDefault(); done(true); }
    };
    document.addEventListener("keydown", key, true);
    root.querySelector(".modal-overlay").addEventListener("click", e => {
      const b = e.target.closest("[data-m]");
      if (b) done(b.dataset.m === "1");
      else if (e.target.classList.contains("modal-overlay")) done(false);
    });
    root.querySelector("[data-m='1']").focus();
  });
}
// A re-render between mousedown and mouseup swaps the button under the cursor and eats the click.
const editing = () => pointerDown || dialogOpen || document.activeElement?.tagName === "TEXTAREA";

function flushRender() {
  if (pendingRender && !editing()) { pendingRender = false; safeRender(); }
}

document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
document.addEventListener("pointerup", () => { pointerDown = false; setTimeout(flushRender, 100); }, true);
document.addEventListener("pointercancel", () => { pointerDown = false; }, true);

async function refresh() {
  if (loading) return;
  loading = true;
  try {
    const res = await fetch("/api/state", {cache: "no-store"});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    updatedAt = new Date();
    prepare(data);
    // The page was updated on disk: reload once nothing is being typed; drafts survive in sessionStorage.
    if (uiVersion === null) uiVersion = data.ui_version;
    else if (data.ui_version && data.ui_version !== uiVersion && !editing()) { saveDrafts(); location.reload(); return; }
    const key = JSON.stringify(data);
    last = data;
    // Re-render only on a real change, so open blocks and scroll stay put.
    if (key !== lastKey) {
      lastKey = key;
      if (editing()) pendingRender = true; else safeRender();
    } else {
      stampUpdated();
    }
  } catch (e) {
    const el = document.getElementById("sub");
    if (el) el.innerHTML = `<span class="error">нет связи с сервером: ${esc(e.message)}</span>`;
  } finally {
    loading = false;
  }
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  return {res, data};
}

document.addEventListener("click", e => {
  if (e.target.closest("button") && e.target.closest("summary.panel-head")) e.preventDefault();
});
document.addEventListener("toggle", e => {
  const k = e.target.dataset?.key;
  if (!k) return;
  e.target.open ? openDetails.add(k) : openDetails.delete(k);
}, true);
function saveDrafts() {
  try { sessionStorage.setItem("desk-drafts", JSON.stringify([...drafts])); } catch (e) { /* storage may be unavailable */ }
}
try { JSON.parse(sessionStorage.getItem("desk-drafts") || "[]").forEach(([k, v]) => drafts.set(k, v)); } catch (e) { /* ignore */ }

document.addEventListener("input", e => {
  const f = e.target.closest("form.reply, form.term-text, form.adv-form");
  if (f) { drafts.set(f.dataset.key, e.target.value); saveDrafts(); }
});
document.addEventListener("focusout", () => setTimeout(() => {
  flushRender();
}, 0));
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); safeRender(); });

document.addEventListener("click", async e => {
  if (e.target.closest("a")) return;
  const q = e.target.closest("[data-quick]");
  if (q) { sendReply(q.closest("form.reply"), q.dataset.quick); return; }
  const sv = e.target.closest("[data-sv], [data-sv-wip]");
  if (sv) {
    const c = (last.supervisor || {}).config || {};
    const patch = sv.dataset.svWip ? {wip: Number(sv.dataset.svWip)} : {[sv.dataset.sv]: !c[sv.dataset.sv]};
    const {res, data} = await post("/api/supervisor/config", patch);
    if (res.ok) { last.supervisor.config = data; safeRender(); } else toast(data.error || "Не сохранилось");
    return;
  }
  const dopt = e.target.closest("[data-desk-opt]");
  if (dopt) {
    const {ask, deskOpt, label} = dopt.dataset;
    const draft = (drafts.get("d:" + ask) || "").trim();
    if (!await dialog({title: `Ответ на ${ask}: ${deskOpt}`, body: `<div class="quote">${esc(deskOpt)}. ${esc(label)}</div>
        <textarea id="dlg-note" placeholder="Комментарий (необязательно)">${esc(draft)}</textarea>`, ok: "Ответить"})) return;
    if (await answerDesk(ask, deskOpt, dialogNote, [])) { drafts.delete("d:" + ask); saveDrafts(); }
    return;
  }
  const am = e.target.closest("[data-adv-model]");
  if (am) { advisorModel.set(am.dataset.stream, am.dataset.advModel); safeRender(); return; }
  const ar = e.target.closest("[data-adv-reset]");
  if (ar) {
    if (!await dialog({title: "Новая беседа", body: `<p class="muted">Советчик забудет прошлые вопросы по ${esc(ar.dataset.advReset)} и заново соберёт контекст задачи.</p>`, ok: "Начать заново"})) return;
    const {res, data} = await post("/api/advisor/reset", {stream: ar.dataset.advReset});
    if (res.ok) advisorState.set(ar.dataset.advReset, data); else toast(data.error || "Не получилось");
    safeRender();
    return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const {stream, label} = pick.dataset;
    if (!await dialog({title: `Ответ в терминал · ${stream}`, body: `<div class="quote">${esc(label)}</div>`, ok: "Выбрать"})) return;
    const {res, data} = await post("/api/terminal", {stream, key: pick.dataset.pick});
    if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
    else toast(`Выбрано: ${data.picked}`);
    lastKey = ""; await refresh();
    return;
  }
  if (e.target.closest("#toggle-closed")) { showClosed = !showClosed; safeRender(); return; }
  const ws = e.target.closest("[data-ws]");
  if (ws) {
    const stream = ws.dataset.stream, action = ws.dataset.ws;
    if (action === "up" && !await dialog({title: `Запустить стенд ${stream}?`, body: `<p class="muted">Выполнится <code>task app:up</code> в worktree задачи. Вывод появится в блоке «Стенд».</p>`, ok: "Запустить"})) return;
    busy.set(stream, action); safeRender();
    const {res, data} = await post(`/api/workspace/${action}`, {stream});
    busy.delete(stream);
    if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
    lastKey = ""; await refresh();
    return;
  }
  const row = e.target.closest("[data-href]");
  if (row) location.hash = row.dataset.href;
});

document.addEventListener("paste", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  const files = e.clipboardData && e.clipboardData.files;
  if (!f || !files || !files.length) return;
  e.preventDefault();
  addImages(f, files);
});
document.addEventListener("dragover", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (f) { e.preventDefault(); f.classList.add("drop"); }
});
document.addEventListener("dragleave", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (f && !f.contains(e.relatedTarget)) f.classList.remove("drop");
});
document.addEventListener("drop", e => {
  const f = e.target.closest && e.target.closest("form.reply");
  if (!f) return;
  e.preventDefault(); f.classList.remove("drop");
  addImages(f, e.dataTransfer.files);
});
document.addEventListener("change", e => {
  if (!e.target.matches("[data-attach]")) return;
  addImages(e.target.closest("form.reply"), e.target.files);
  e.target.value = "";
});
document.addEventListener("click", e => {
  const x = e.target.closest("[data-unattach]");
  if (!x) return;
  const f = x.closest("form.reply"), list = attachments.get(f.dataset.key) || [];
  const [gone] = list.splice(Number(x.dataset.unattach), 1);
  if (gone) URL.revokeObjectURL(gone.url);
  redrawThumbs(f);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.matches("form.adv-form")) return askAdvisor(e.target);
  if (e.target.matches("form.desk-form")) {
    const f = e.target, key = f.dataset.key, text = f.querySelector("textarea").value.trim();
    const list = attachments.get(key) || [];
    if (list.some(a => !a.path)) return toast("Картинка ещё загружается");
    if (!text && !list.length) return toast("Пустой ответ");
    const body = `<div class="quote">${esc(text).replace(/\n/g, "<br>")}</div>` + (list.length ? `<div class="thumbs">${list.map(a => `<span class="thumb"><img src="${esc(a.url)}" alt=""></span>`).join("")}</div>` : "");
    if (!await dialog({title: `Ответ на ${f.dataset.ask}`, body, ok: "Ответить"})) return;
    if (await answerDesk(f.dataset.ask, null, text, list.map(a => a.path))) {
      drafts.delete(key); saveDrafts(); attachments.delete(key);
    }
    return;
  }
  if (!e.target.matches("form.term-text")) return sendReply(e.target, null);
  const f = e.target, text = f.querySelector("textarea").value.trim(), stream = f.dataset.stream;
  if (!text) return;
  if (!await dialog({title: `Свой ответ в терминал · ${stream}`, body: `<div class="quote">${esc(text)}</div>`, ok: "Отправить"})) return;
  const {res, data} = await post("/api/terminal", {stream, text});
  if (!res.ok) await dialog({title: "Не получилось", body: `<p class="error">${esc(data.error || res.status)}</p>`, ok: "Понятно", cancel: ""});
  else { toast("Ответ ушёл в терминал"); drafts.delete(f.dataset.key); saveDrafts(); }
  lastKey = ""; await refresh();
});

// quick: a canned reply sent on its own (still confirmed); null sends the typed text and images.
async function sendReply(f, quick) {
  const ta = f.querySelector("textarea"), rc = f.querySelector(".receipt"), btn = f.querySelector("button[type=submit]");
  const note = (cls, text) => { rc.className = "receipt " + cls; rc.textContent = text; receipts.set(f.dataset.key, {cls, text}); };
  const text = quick ?? ta.value.trim();
  const list = quick ? [] : attachments.get(f.dataset.key) || [];
  if (list.some(a => !a.path && !a.error)) { note("err", "Картинка ещё загружается."); return; }
  if (list.some(a => a.error)) { note("err", "Убери картинки с ошибкой."); return; }
  const images = list.map(a => a.path);
  const asks = JSON.parse(f.dataset.asks || "[]");
  if (!text && !images.length) { note("err", "Пустой ответ."); return; }
  const preview = (asks.length ? `<p class="muted">На вопрос: ${asks.map(a => `«${inline(a)}»`).join("; ")}</p>` : "") + (text ? `<div class="quote">${esc(text).replace(/\n/g, "<br>")}</div>` : "") +
    (list.length ? `<div class="thumbs">${list.map(a => `<span class="thumb"><img src="${esc(a.url)}" alt=""></span>`).join("")}</div>` : "");
  const kind = f.dataset.kind || "reply";
  const title = kind === "note" ? `Комментарий · ${f.dataset.stream}` : `Ответ оркестратору${f.dataset.stream ? " · " + f.dataset.stream : ""}`;
  if (!await dialog({title, body: preview, ok: "Отправить"})) return;
  btn.disabled = true; note("", "Отправляю…");
  try {
    const {res, data: r} = await post("/api/reply", {session_id: f.dataset.session, stream: f.dataset.stream, text, images, asks, kind});
    if (res.ok && r.ok) {
      note("", "Доставлено оркестратору · " + new Date().toLocaleTimeString("ru-RU", {hourCycle: "h23"}));
      if (!quick) {
        drafts.delete(f.dataset.key); saveDrafts(); ta.value = "";
        list.forEach(a => URL.revokeObjectURL(a.url)); attachments.delete(f.dataset.key); redrawThumbs(f);
      }
    } else {
      note("err", "Не доставлено: " + (r.error || JSON.stringify(r.receipt || r)));
    }
  } catch (err) {
    note("err", "Ошибка: " + err.message);
  } finally {
    btn.disabled = false;
    // A render may have replaced this form while the request ran; redraw from the saved state.
    if (!f.isConnected && !editing()) safeRender();
  }
}

async function askAdvisor(f) {
  const id = f.dataset.stream, ta = f.querySelector("textarea"), question = ta.value.trim();
  if (!question) return;
  const model = advisorModel.get(id) || (advisorState.get(id) || {}).model || "sonnet";
  const {res, data} = await post("/api/advisor", {stream: id, question, model});
  if (!res.ok) return toast(data.error || "Советчик не запустился");
  drafts.delete(f.dataset.key); saveDrafts(); ta.value = ""; ta.blur();
  advisorState.set(id, data);
  loadAdvisor(id);
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.closest && e.target.closest("form.adv-form")) {
    e.preventDefault();
    askAdvisor(e.target.closest("form.adv-form"));
  }
});

function anyPending() {
  if (!last) return false;
  if ((last.desk_asks || []).some(a => a.status === "answered" || a.status === "consumed")) return true;
  return last.streams.some(s => (streamReply(s) || {}).kind === "pending")
    || last.general_asks.some(g => (replyState("", g.orchestrator, true, g.item) || {}).kind === "pending");
}

// Poll fast while a reply is on its way, so the unblock is seen as it happens.
(async function loop() {
  await refresh();
  setTimeout(loop, anyPending() ? 1500 : 5000);
})();
</script>
